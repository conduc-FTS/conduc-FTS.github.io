<title>FTS — Récapitulatif Hebdomadaire</title>
<link rel="stylesheet" href="../css/dashboard.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
.rh-topbar-right { display: flex; align-items: center; gap: 14px; }
.rh-body { max-width: 1800px; margin: 24px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }

.rh-nav-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.rh-nav-left { display: flex; align-items: center; gap: 12px; }
.rh-nav-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: white;
  cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
}
.rh-nav-title { font-weight: 800; font-size: 1.15rem; }
.rh-nav-sub { font-size: 0.82rem; color: var(--text-sub); }
.rh-btn-actuelle {
  background: white; border: 1px solid var(--fts-yellow); color: var(--anthracite); font-weight: 700;
  border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 0.82rem;
}
.rh-legende { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-sub); align-items: center; }
.rh-legende .item { display: flex; align-items: center; gap: 5px; }
.rh-legende .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

.rh-section-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-sub); font-weight: 700; margin-bottom: 10px; }

.rh-semaine-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.rh-jour-col { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; min-height: 140px; }
.rh-jour-col.aujourdhui { border-color: var(--fts-yellow); border-width: 2px; box-shadow: 0 0 0 1px var(--fts-yellow); }
.rh-jour-nom { font-size: 0.68rem; text-transform: uppercase; color: var(--text-sub); font-weight: 700; }
.rh-jour-num { font-size: 1.2rem; font-weight: 800; color: var(--anthracite); margin-bottom: 8px; }
.rh-jour-col.aujourdhui .rh-jour-num { display: inline-block; background: var(--fts-yellow); border-radius: 50%; width: 26px; height: 26px; line-height: 26px; text-align: center; font-size: 0.95rem; }
.rh-jour-vide { font-size: 0.76rem; color: var(--text-sub); margin-top: 6px; }

.rh-chantier-bloc { border-left: 3px solid #999; border-radius: 8px; background: var(--bg); padding: 7px 9px; margin-bottom: 8px; }
.rh-chantier-nom { font-size: 0.68rem; font-weight: 800; color: var(--anthracite); line-height: 1.2; margin-bottom: 4px; }
.rh-entree-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 0.74rem; padding: 2px 0; }
.rh-entree-nom { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rh-entree-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.rh-entree-val { font-weight: 700; color: var(--text-sub); white-space: nowrap; flex-shrink: 0; }
.rh-gd-tag { background: var(--anthracite); color: var(--fts-yellow); font-size: 0.6rem; font-weight: 800; padding: 1px 5px; border-radius: 6px; margin-left: 3px; }
.rh-groupe-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-sub); margin: 5px 0 2px 0; }
.rh-groupe-label.loc { color: #B8730A; }
.rh-separateur-loc { border-top: 1px dashed #E7C878; margin: 5px 0 3px 0; }
.rh-entree-row.rh-loc-row { background: #FFF8EC; margin: 0 -6px; padding: 3px 6px; border-radius: 4px; }

.rh-recapp-table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
.rh-recapp-table th, .rh-recapp-table td { border: 1px solid var(--border); padding: 8px 12px; text-align: center; }
.rh-recapp-table th { background: var(--anthracite); color: white; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em; }
.rh-recapp-table td:first-child { text-align: left; font-weight: 700; background: #FAFAFA; vertical-align: middle; }
.rh-recapp-table td.chantier { text-align: left; }
.rh-recapp-table td.chantier .code { display: block; font-size: 0.68rem; color: var(--text-sub); font-weight: 700; }
.rh-recapp-table td.chantier .nom { font-weight: 600; }
.rh-recapp-total-row td { background: #F5F6F8; font-weight: 800; }
.rh-recapp-total-row td:first-child { text-align: right; font-weight: 800; color: var(--text-sub); font-size: 0.76rem; }
.rh-recapp-separateur td {
  background: #3A2E00; color: var(--fts-yellow); font-weight: 800; text-align: center;
  font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
}
.rh-recapp-table tr.interim td:first-child, .rh-recapp-table tr.interim td { background: #FFF8EC; }

@media (max-width: 1000px) {
  .rh-semaine-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .rh-semaine-grid { grid-template-columns: repeat(2, 1fr); }
}

.rh-controls-row { display: flex; gap: 10px; flex-wrap: wrap; }

.pointage-ajout-form {
  background: var(--bg); border: 1px dashed var(--border); border-radius: 12px;
  padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
}
.pointage-ajout-form .field { min-width: 140px; }
.pointage-ajout-form select, .pointage-ajout-form input[type="text"], .pointage-ajout-form input[type="date"] {
  padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; width: 100%;
}
.pc-edit-gd-label { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: var(--text-sub); }

.pc-icon-btn {
  background: white; border: 1px solid var(--border); border-radius: 6px;
  width: 22px; height: 22px; cursor: pointer; font-size: 0.68rem; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0;
}
.rh-entree-actions { display: flex; gap: 3px; flex-shrink: 0; }
.rh-entree-edit { display: none; flex-wrap: wrap; gap: 5px; align-items: center; margin: 4px 0; width: 100%; }
.rh-entree-edit input[type="text"], .rh-entree-edit select {
  padding: 4px 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.72rem; min-width: 60px;
}
.rh-entree-row.editing .rh-entree-view { display: none; }
.rh-entree-row.editing .rh-entree-edit { display: flex; }
.rh-entree-row { flex-wrap: wrap; }
.rh-entree-view { display: flex; justify-content: space-between; align-items: center; flex: 1; gap: 6px; min-width: 0; }
</style>
</head>

  <a href="../supervision-encadrement/index.html" class="topbar-brand" style="text-decoration:none;cursor:pointer">

<main class="rh-body">

  <div class="rh-nav-row">
    <div class="rh-nav-left">
      <button type="button" class="rh-nav-btn" id="semainePrecBtn">‹</button>
      <button type="button" class="rh-nav-btn" id="semaineSuivBtn">›</button>
      <div>
        <div class="rh-nav-title" id="semaineTitre">Semaine —</div>
        <div class="rh-nav-sub" id="semaineSous">—</div>
      </div>

  <div class="rh-controls-row">
    <button type="button" class="rh-btn-actuelle" id="ajouterBtn">➕ Ajouter une entrée</button>

<script src="../js/auth.js"></script>
<script src="../js/drive.js"></script>
<script src="../js/sheets.js"></script>
<script src="../js/calendar.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(window.location.search);
  const type = params.get("type") === "materiel" ? "materiel" : "personnel";
  const onglet = type === "materiel" ? "Materiel" : "Personnel";
  const estMateriel = type === "materiel";
  if (!estMateriel) document.getElementById("recapPersonnelSection").style.display = "";

  document.title = estMateriel ? "FTS — Récapitulatif Hebdomadaire Matériel" : "FTS — Récapitulatif Hebdomadaire Personnel";
  document.getElementById("rhSousTitre").textContent = estMateriel
    ? "Pointage Matériel FTS · Statuts machines"
    : "Pointage personnel FTS · Heures & Grand Déplacement";

  const PALETTE = ["#4C82F0", "#EE7C93", "#3FAE63", "#E8B923", "#9B6FD8", "#3A86FF", "#E24C4C", "#26A69A"];
  const couleurParChantier = {};
  function couleurChantier(nom) {
    if (!couleurParChantier[nom]) {
      const i = Object.keys(couleurParChantier).length % PALETTE.length;
      couleurParChantier[nom] = PALETTE[i];
    }
    return couleurParChantier[nom];
  }

  const JOURS = ["LUNDI", "MARDI", "MERCREDI", "JEUDI", "VENDREDI", "SAMEDI"];

  function lundiDeLaSemaine(d) {
    const date = new Date(d);
    const jour = date.getDay(); // 0 = dimanche
    const diff = jour === 0 ? -6 : 1 - jour;
    date.setDate(date.getDate() + diff);
    date.setHours(0, 0, 0, 0);
    return date;
  }

  function isoDate(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function frDate(d) { const [a, m, j] = isoDate(d).split("-"); return `${j}/${m}/${a}`; }
  function numeroSemaine(d) {
    const t = new Date(d);
    t.setHours(0, 0, 0, 0);
    t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
    const s = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - s) / 86400000 - 3 + ((s.getDay() + 6) % 7)) / 7);
  }

  const STATUTS_MACHINE = ["TRAVAIL", "PANNE", "ARRET", "TRANSPORT"];
  let dernieresEntrees = [];
  let derniersJours = [];
  let chantiersCache = null;

  let lundiCourant = lundiDeLaSemaine(new Date());

  async function chargerSemaine() {
    const status = document.getElementById("rhStatus");
    if (!window.FTSAuth || !FTSAuth.isSignedIn()) { status.textContent = "Connecte-toi d'abord."; return; }
    if (!window.FTSSheets) { status.textContent = "Erreur : module Sheets non chargé."; return; }

    const jours = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(lundiCourant);
      d.setDate(d.getDate() + i);
      jours.push(d);
    }
    const samedi = jours[5];

    document.getElementById("semaineTitre").textContent = `Semaine ${numeroSemaine(lundiCourant)} — ${lundiCourant.getFullYear()}`;
    document.getElementById("semaineSous").textContent =
      `Du lundi ${lundiCourant.getDate()} ${lundiCourant.toLocaleDateString("fr-FR", { month: "long" })} au samedi ${samedi.getDate()} ${samedi.toLocaleDateString("fr-FR", { month: "long" })} ${samedi.getFullYear()}`;

    status.textContent = "Chargement...";
    try {
      const entrees = await FTSSheets.listerPointageToutesChantiers(onglet, isoDate(lundiCourant), isoDate(samedi));
      status.textContent = "";
      dernieresEntrees = entrees;
      derniersJours = jours;
      afficherSemaine(jours, entrees);
      attacherActionsEntrees();
    } catch (err) {
      console.error(err);
      status.textContent = `Erreur : ${err.message}`;
    }
  }

  function afficherSemaine(jours, entrees) {
    // Reset palette pour une correspondance stable chantier -> couleur sur la semaine affichée
    Object.keys(couleurParChantier).forEach((k) => delete couleurParChantier[k]);

    const parJourFR = {};
    jours.forEach((d) => { parJourFR[frDate(d)] = []; });
    entrees.forEach((e) => {
      const dFR = e.cols[0];
      if (parJourFR[dFR]) parJourFR[dFR].push(e);
    });

    // Légende chantiers actifs cette semaine
    const chantiersSemaine = [...new Set(entrees.map((e) => e.chantierName))];
    chantiersSemaine.forEach((c) => couleurChantier(c)); // fige l'ordre de couleur
    const legende = document.getElementById("legendeChantiers");
    legende.innerHTML = chantiersSemaine.map((c) => {
      const code = c.split(/\s+/)[0];
      const nom = c.slice(code.length).trim();
      return `<span class="item"><span class="dot" style="background:${couleurChantier(c)}"></span>${escapeHtmlRH(code)} ${escapeHtmlRH(nom.split(" ").slice(0, 2).join(" "))}</span>`;
    }).join("");

    // Grille calendrier
    const aujourdhuiFR = frDate(new Date());
    const grid = document.getElementById("semaineGrid");
    grid.innerHTML = jours.map((d, i) => {
      const dFR = frDate(d);
      const estAuj = dFR === aujourdhuiFR;
      const entreesJour = parJourFR[dFR] || [];
      const parChantier = {};
      entreesJour.forEach((e) => {
        if (!parChantier[e.chantierName]) parChantier[e.chantierName] = [];
        parChantier[e.chantierName].push(e);
      });

      const blocs = Object.keys(parChantier).map((nomChantier) => {
        const code = nomChantier.split(/\s+/)[0];
        const nom = nomChantier.slice(code.length).trim();
        const couleur = couleurChantier(nomChantier);
        let lignes;
        if (estMateriel) {
          const rendreLigneMateriel = (e, estLoc) => {
            const attrs = `data-spreadsheet="${e.spreadsheetId}" data-row="${e.sheetRow}"`;
            const [, machine, statut, ftsLoc] = e.cols;
            const optionsStatut = STATUTS_MACHINE.map((s) => `<option value="${s}" ${s === statut ? "selected" : ""}>${s}</option>`).join("");
            return `
              <div class="rh-entree-row${estLoc ? " rh-loc-row" : ""}" ${attrs}>
                <div class="rh-entree-view">
                  <span class="rh-entree-nom"><span class="rh-entree-dot" style="background:${DOT_COULEUR_STATUT[statut] || "#888"}"></span>${escapeHtmlRH(machine)}</span>
                  <span class="rh-entree-val">${escapeHtmlRH(statut)}</span>
                  <span class="rh-entree-actions">
                    <button type="button" class="pc-icon-btn rh-edit-btn" title="Modifier">✏️</button>
                    <button type="button" class="pc-icon-btn rh-delete-btn" title="Supprimer">🗑️</button>
                  </span>
                </div>
                <div class="rh-entree-edit">
                  <input type="text" class="ri-machine" value="${escapeHtmlRH(machine)}" style="width:70px">
                  <select class="ri-statut">${optionsStatut}</select>
                  <input type="text" class="ri-ftsloc" value="${escapeHtmlRH(ftsLoc)}" placeholder="FTS/LOC" style="width:55px">
                  <button type="button" class="pc-icon-btn rh-save-btn" title="Enregistrer">✅</button>
                  <button type="button" class="pc-icon-btn rh-cancel-btn" title="Annuler">✖️</button>
                </div>
              </div>`;
          };
          // Matériel FTS d'abord, matériel de location en dessous (y compris
          // les entrées sans FTS/LOC renseigné, classées FTS par défaut).
          const estLocEntree = (e) => (e.cols[3] || "").toUpperCase() === "LOC";
          const entreesFTS = parChantier[nomChantier].filter((e) => !estLocEntree(e));
          const entreesLOC = parChantier[nomChantier].filter((e) => estLocEntree(e));
          lignes = entreesFTS.map((e) => rendreLigneMateriel(e, false)).join("");
          if (entreesLOC.length > 0) {
            lignes += '<div class="rh-separateur-loc"></div><div class="rh-groupe-label loc">Matériel Location</div>';
            lignes += entreesLOC.map((e) => rendreLigneMateriel(e, true)).join("");
          }
        } else {
          lignes = parChantier[nomChantier].map((e) => {
          const attrs = `data-spreadsheet="${e.spreadsheetId}" data-row="${e.sheetRow}"`;
          const [, nomP, type, gd, heures] = e.cols;
          return `
            <div class="rh-entree-row" ${attrs}>
              <div class="rh-entree-view">
                <span class="rh-entree-nom">${escapeHtmlRH(nomP)}${gd === "GD" ? '<span class="rh-gd-tag">GD</span>' : ""}</span>
                <span class="rh-entree-val">${heures ? escapeHtmlRH(heures) + "h" : ""}</span>
                <span class="rh-entree-actions">
                  <button type="button" class="pc-icon-btn rh-edit-btn" title="Modifier">✏️</button>
                  <button type="button" class="pc-icon-btn rh-delete-btn" title="Supprimer">🗑️</button>
                </span>
              </div>
              <div class="rh-entree-edit">
                <input type="text" class="ri-nom" value="${escapeHtmlRH(nomP)}" style="width:80px">
                <select class="ri-type">
                  <option value="FTS" ${type === "FTS" ? "selected" : ""}>FTS</option>
                  <option value="Intérim" ${type === "Intérim" ? "selected" : ""}>Intérim</option>
                </select>
                <input type="text" class="ri-heures" value="${escapeHtmlRH(heures)}" placeholder="h" style="width:36px">
                <label class="pc-edit-gd-label"><input type="checkbox" class="ri-gd" ${gd === "GD" ? "checked" : ""}> GD</label>
                <button type="button" class="pc-icon-btn rh-save-btn" title="Enregistrer">✅</button>
                <button type="button" class="pc-icon-btn rh-cancel-btn" title="Annuler">✖️</button>
              </div>
            </div>`;
          }).join("");
        }
        return `
          <div class="rh-chantier-bloc" style="border-left-color:${couleur}">
            <div class="rh-chantier-nom">${escapeHtmlRH(code)}<br>${escapeHtmlRH(nom)}</div>
            ${lignes}
          </div>`;
      }).join("");

      return `
        <div class="rh-jour-col ${estAuj ? "aujourdhui" : ""}">
          <div class="rh-jour-nom">${JOURS[i]}</div>
          <div class="rh-jour-num">${d.getDate().toString().padStart(2, "0")}</div>
          ${blocs || '<div class="rh-jour-vide">Aucune activité</div>'}
        </div>`;
    }).join("");

    // Récapitulatif matériel/Chantiers actifs cette semaine ont été
    // retirés : le calendrier ci-dessus et l'export Excel couvrent déjà
    // ce besoin. Le Récapitulatif personnel, lui, reste utile (heures/GD
    // par personne, y compris sur plusieurs chantiers dans la semaine).
    if (!estMateriel) afficherRecapPersonnel(entrees);
  }

  function afficherRecapPersonnel(entrees) {
    const wrap = document.getElementById("recapPersonnelWrap");
    if (!wrap) return;

    if (entrees.length === 0) {
      wrap.innerHTML = '<tr><td colspan="4" class="form-status">Aucune donnée sur cette période.</td></tr>';
      return;
    }

    // Regroupe par personne, puis par chantier au sein de chaque personne
    const parPersonne = {};
    entrees.forEach((e) => {
      const [, nom, type, gd] = e.cols;
      if (!parPersonne[nom]) parPersonne[nom] = { nom, type, parChantier: {} };
      if (type === "Intérim") parPersonne[nom].type = "Intérim"; // un intérim reste intérim même si mal saisi ailleurs
      if (!parPersonne[nom].parChantier[e.chantierName]) {
        parPersonne[nom].parChantier[e.chantierName] = { heures: 0, gd: 0 };
      }
      const c = parPersonne[nom].parChantier[e.chantierName];
      c.heures += parseFloat((e.cols[4] || "").replace(",", ".")) || 0;
      if (gd === "GD") c.gd += 1;
    });

    const rendreLignes = (p, estInterim) => {
      const chantiers = Object.entries(p.parChantier);
      const totalHeures = chantiers.reduce((s, [, c]) => s + c.heures, 0);
      const totalGD = chantiers.reduce((s, [, c]) => s + c.gd, 0);
      const classeInterim = estInterim ? " class=\"interim\"" : "";
      const nbLignes = chantiers.length + (chantiers.length > 1 ? 1 : 0);

      const lignesChantier = chantiers.map(([nomChantier, c], idx) => {
        const spaceIdx = nomChantier.search(/\s/);
        const code = spaceIdx > 0 ? nomChantier.slice(0, spaceIdx) : nomChantier;
        const nom = spaceIdx > 0 ? nomChantier.slice(spaceIdx + 1) : nomChantier;
        const celluleNom = idx === 0 ? `<td rowspan="${nbLignes}">${escapeHtmlRH(p.nom)}</td>` : "";
        return `
          <tr${classeInterim}>
            ${celluleNom}
            <td class="chantier"><span class="code">${escapeHtmlRH(code)}</span><span class="nom">${escapeHtmlRH(nom)}</span></td>
            <td>${c.heures.toFixed(1)}h</td>
            <td>${c.gd}j</td>
          </tr>`;
      }).join("");

      const ligneTotal = chantiers.length > 1
        ? `<tr${classeInterim} class="${estInterim ? "interim " : ""}rh-recapp-total-row"><td>Total semaine</td><td>${totalHeures.toFixed(1)}h</td><td>${totalGD}j</td></tr>`
        : "";

      return lignesChantier + ligneTotal;
    };

    const personnes = Object.values(parPersonne).sort((a, b) => a.nom.localeCompare(b.nom));
    const fts = personnes.filter((p) => p.type !== "Intérim");
    const interim = personnes.filter((p) => p.type === "Intérim");

    let html = fts.map((p) => rendreLignes(p, false)).join("");
    if (interim.length > 0) {
      html += '<tr class="rh-recapp-separateur"><td colspan="4">Personnel Intérim</td></tr>';
      html += interim.map((p) => rendreLignes(p, true)).join("");
    }
    wrap.innerHTML = html;
  }

  const DOT_COULEUR_STATUT = { TRAVAIL: "#3FAE63", PANNE: "#E24C4C", ARRET: "#9AA0AA", TRANSPORT: "#4C82F0" };

  function escapeHtmlRH(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function attacherActionsEntrees() {
    document.querySelectorAll(".rh-entree-row").forEach((row) => {
      const editBtn = row.querySelector(".rh-edit-btn");
      const cancelBtn = row.querySelector(".rh-cancel-btn");
      const saveBtn = row.querySelector(".rh-save-btn");
      const deleteBtn = row.querySelector(".rh-delete-btn");
      if (!editBtn) return;

      editBtn.addEventListener("click", () => row.classList.add("editing"));
      cancelBtn.addEventListener("click", () => row.classList.remove("editing"));

      saveBtn.addEventListener("click", async () => {
        saveBtn.disabled = true;
        const spreadsheetId = row.dataset.spreadsheet;
        const sheetRow = Number(row.dataset.row);
        // On retrouve la date d'origine via dernieresEntrees (non affichée dans la ligne compacte)
        const entree = dernieresEntrees.find((e) => e.spreadsheetId === spreadsheetId && e.sheetRow === sheetRow);
        const date = entree ? entree.cols[0] : "";
        try {
          const valeurs = estMateriel
            ? [date, row.querySelector(".ri-machine").value.trim(), row.querySelector(".ri-statut").value, row.querySelector(".ri-ftsloc").value.trim()]
            : [date, row.querySelector(".ri-nom").value.trim(), row.querySelector(".ri-type").value, row.querySelector(".ri-gd").checked ? "GD" : "", row.querySelector(".ri-heures").value.trim()];
          await FTSSheets.modifierLignePointage(spreadsheetId, onglet, sheetRow, valeurs);
          document.getElementById("rhStatus").textContent = "Modification enregistrée.";
          chargerSemaine();
        } catch (err) {
          console.error(err);
          document.getElementById("rhStatus").textContent = `Erreur : ${err.message}`;
          saveBtn.disabled = false;
        }
      });

      deleteBtn.addEventListener("click", async () => {
        if (!confirm("Supprimer cette ligne ?")) return;
        deleteBtn.disabled = true;
        try {
          await FTSSheets.supprimerLignePointage(row.dataset.spreadsheet, onglet, Number(row.dataset.row));
          document.getElementById("rhStatus").textContent = "Ligne supprimée.";
          chargerSemaine();
        } catch (err) {
          console.error(err);
          document.getElementById("rhStatus").textContent = `Erreur : ${err.message}`;
          deleteBtn.disabled = false;
        }
      });
    });
  }

  async function ouvrirFormulaireAjout() {
    const ajoutForm = document.getElementById("ajoutForm");
    if (ajoutForm.hidden === false) { ajoutForm.hidden = true; return; }

    const ajouterBtn = document.getElementById("ajouterBtn");
    if (!chantiersCache) {
      if (!window.FTSDrive) { document.getElementById("rhStatus").textContent = "Erreur : module Drive non chargé."; return; }
      ajouterBtn.disabled = true;
      try {
        chantiersCache = await FTSDrive.listChantiers();
      } catch (err) {
        document.getElementById("rhStatus").textContent = `Erreur : ${err.message}`;
        ajouterBtn.disabled = false;
        return;
      }
      ajouterBtn.disabled = false;
    }

    const optionsChantiers = chantiersCache.map((c) => `<option value="${c.id}" data-nom="${escapeHtmlRH(c.name)}">${escapeHtmlRH(c.name)}</option>`).join("");
    const aujourdhuiISO = isoDate(new Date());

    const champsSpecifiques = estMateriel
      ? `
        <div class="field"><label>Machine</label><input type="text" id="ajoutChamp2" placeholder="ex : FUTURO 1"></div>
        <div class="field"><label>Statut</label><select id="ajoutChamp3">${STATUTS_MACHINE.map((s) => `<option value="${s}">${s}</option>`).join("")}</select></div>
        <div class="field"><label>FTS / LOC</label><input type="text" id="ajoutChamp4" placeholder="FTS"></div>`
      : `
        <div class="field"><label>Nom</label><input type="text" id="ajoutChamp2" placeholder="ex : Jean Dupont"></div>
        <div class="field"><label>Type</label><select id="ajoutChamp3"><option value="FTS">FTS</option><option value="Intérim">Intérim</option></select></div>
        <div class="field" style="min-width:auto"><label class="pc-edit-gd-label" style="margin-top:8px"><input type="checkbox" id="ajoutChamp4"> GD</label></div>
        <div class="field"><label>Heures</label><input type="text" id="ajoutChamp5" placeholder="ex : 7.5" style="max-width:80px"></div>`;

    ajoutForm.innerHTML = `
      <div class="field"><label>Chantier</label><select id="ajoutChantier">${optionsChantiers}</select></div>
      <div class="field"><label>Date</label><input type="date" id="ajoutDate" value="${aujourdhuiISO}"></div>
      ${champsSpecifiques}
      <button type="button" class="btn-primary" id="ajoutValider">Enregistrer</button>
      <button type="button" class="btn-secondary" id="ajoutAnnuler">Annuler</button>
    `;
    ajoutForm.hidden = false;

    document.getElementById("ajoutAnnuler").addEventListener("click", () => { ajoutForm.hidden = true; });
    document.getElementById("ajoutValider").addEventListener("click", async () => {
      const btn = document.getElementById("ajoutValider");
      const chantierSelect = document.getElementById("ajoutChantier");
      const chantierId = chantierSelect.value;
      const chantierName = chantierSelect.selectedOptions[0]?.dataset.nom || "";
      const dateISO = document.getElementById("ajoutDate").value;
      const champ2 = document.getElementById("ajoutChamp2").value.trim();
      const champ3 = document.getElementById("ajoutChamp3").value;
      const champ4Input = document.getElementById("ajoutChamp4");
      const champ4 = estMateriel ? champ4Input.value.trim() : (champ4Input.checked ? "GD" : "");
      const champ5 = !estMateriel ? (document.getElementById("ajoutChamp5")?.value.trim() || "") : "";

      if (!chantierId || !dateISO || !champ2) { document.getElementById("rhStatus").textContent = "Chantier, date et nom/machine sont obligatoires."; return; }

      const [a, m, j] = dateISO.split("-");
      const dateAffichage = `${j}/${m}/${a}`;

      btn.disabled = true;
      document.getElementById("rhStatus").textContent = "Ajout en cours...";
      try {
        const valeurs = estMateriel ? [dateAffichage, champ2, champ3, champ4] : [dateAffichage, champ2, champ3, champ4, champ5];
        await FTSSheets.ajouterLignePointage(chantierId, chantierName, onglet, valeurs);
        document.getElementById("rhStatus").textContent = "Entrée ajoutée.";
        ajoutForm.hidden = true;
        chargerSemaine();
      } catch (err) {
        console.error(err);
        document.getElementById("rhStatus").textContent = `Erreur : ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });
  }

  function convertirDateFRversISO(s) {
    const [j, m, a] = (s || "").split("/");
    return j && m && a ? `${a}-${m.padStart(2, "0")}-${j.padStart(2, "0")}` : null;
  }

  async function synchroniserAgenda() {
    const status = document.getElementById("rhStatus");
    if (!window.FTSAuth || !FTSAuth.isSignedIn()) { status.textContent = "Connecte-toi d'abord."; return; }
    if (!window.FTSCalendar) { status.textContent = "Erreur : module Agenda non chargé."; return; }
    if (dernieresEntrees.length === 0) { status.textContent = "Charge d'abord une semaine avant de synchroniser."; return; }

    const syncBtn = document.getElementById("syncBtn");
    syncBtn.disabled = true;
    status.textContent = "Synchronisation avec Google Agenda...";
    try {
      const groupes = {};
      dernieresEntrees.forEach((e) => {
        const dateISO = convertirDateFRversISO(e.cols[0]);
        if (!dateISO) return;
        const cle = `${e.chantierName}||${dateISO}`;
        if (!groupes[cle]) groupes[cle] = { chantierName: e.chantierName, dateISO, items: [] };
        groupes[cle].items.push(e.cols);
      });
      const listeGroupes = Object.values(groupes);
      for (const g of listeGroupes) {
        if (estMateriel) {
          const machines = g.items.map((cols) => ({ nom: cols[1], statut: cols[2], ftsLoc: cols[3] }));
          await FTSCalendar.enregistrerPointageMachine(g.chantierName, g.dateISO, machines);
        } else {
          const personnel = g.items.map((cols) => ({ nom: cols[1], type: cols[2], gd: cols[3] === "GD", heures: cols[4] }));
          await FTSCalendar.enregistrerPointagePersonnel(g.chantierName, g.dateISO, personnel);
        }
      }
      status.textContent = `Synchronisé avec Google Agenda (${listeGroupes.length} jour(s) × chantier mis à jour).`;
    } catch (err) {
      console.error(err);
      status.textContent = `Erreur de synchronisation : ${err.message}`;
    } finally {
      syncBtn.disabled = false;
    }
  }

  document.getElementById("ajouterBtn").addEventListener("click", ouvrirFormulaireAjout);
  document.getElementById("syncBtn").addEventListener("click", synchroniserAgenda);

  function exporterCSV() {
    const lignes = estMateriel
      ? [["Date", "Chantier", "Machine", "Statut", "FTS/LOC"]]
      : [["Date", "Chantier", "Nom", "Type", "GD", "Heures"]];

    const jours = [];
    for (let i = 0; i < 6; i++) { const d = new Date(lundiCourant); d.setDate(d.getDate() + i); jours.push(d); }

    FTSSheets.listerPointageToutesChantiers(onglet, isoDate(lundiCourant), isoDate(jours[5])).then((entrees) => {
      entrees.forEach((e) => lignes.push([e.cols[0], e.chantierName, ...e.cols.slice(1)]));
      const csv = lignes.map((l) => l.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Pointage_${type}_semaine_${numeroSemaine(lundiCourant)}_${lundiCourant.getFullYear()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  document.getElementById("exportTopBtn").addEventListener("click", exporterCSV);

  document.getElementById("semainePrecBtn").addEventListener("click", () => {
    lundiCourant.setDate(lundiCourant.getDate() - 7);
    chargerSemaine();
  });
  document.getElementById("semaineSuivBtn").addEventListener("click", () => {
    lundiCourant.setDate(lundiCourant.getDate() + 7);
    chargerSemaine();
  });
  document.getElementById("semaineActuelleBtn").addEventListener("click", () => {
    lundiCourant = lundiDeLaSemaine(new Date());
    chargerSemaine();
  });

  if (window.FTSAuth) {
    FTSAuth.onAuthChange(async (signedIn) => {
      const adminAccountInfo = document.getElementById("adminAccountInfo");
      const userDot = document.getElementById("userDot");
      if (signedIn) {
        const info = await FTSAuth.getUserInfo();
        adminAccountInfo.textContent = info ? info.email : "Connecté";
        userDot.classList.add("online");
        chargerSemaine();
      } else {
        adminAccountInfo.textContent = "Non connecté";
        userDot.classList.remove("online");
      }
    });
    FTSAuth.init();
    if (FTSAuth.isSignedIn()) {
      FTSAuth.getUserInfo().then((info) => {
        document.getElementById("adminAccountInfo").textContent = info ? info.email : "Connecté";
        document.getElementById("userDot").classList.add("online");
      });
      chargerSemaine();
    } else {
      document.getElementById("rhStatus").textContent = "Connecte-toi depuis le dashboard principal, puis reviens sur cette page.";
    }
  }
});
</script>
