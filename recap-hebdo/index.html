<style>
.pt-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.pt-seg { display: flex; background: #E9EBEE; border-radius: 9px; padding: 3px; gap: 2px; }
.pt-seg[hidden] { display: none !important; }
.pt-seg button { border: none; background: none; padding: 8px 13px; border-radius: 7px; font-weight: 700; font-size: 0.82rem; color: var(--text-sub); cursor: pointer; white-space: nowrap; }
.pt-seg button.on { background: #fff; color: var(--anthracite); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
.pt-seg.fam button.on { background: var(--anthracite); color: #fff; }
.pt-wnav { display: flex; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.pt-wnav button { border: none; background: none; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; color: var(--text-sub); }
.pt-wnav .lbl { padding: 0 12px; font-weight: 800; font-size: 0.92rem; white-space: nowrap; text-align: center; }
.pt-wnav .lbl small { font-weight: 600; color: var(--text-sub); margin-left: 6px; }
.pt-fld { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 0 12px; height: 40px; font-size: 0.86rem; }
.pt-fld label { color: var(--text-sub); font-weight: 700; font-size: 0.72rem; white-space: nowrap; }
.pt-fld input, .pt-fld select { border: none; outline: none; font: inherit; background: none; }
.pt-maj { font-size: 0.76rem; color: var(--text-sub); white-space: nowrap; }
.pt-leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-sub); }
.pt-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Grille (personnel + planning matériel) */
.pt-scroll { overflow-x: auto; }
table.pt-grid { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
.pt-grid th { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-sub); font-weight: 700; padding: 6px 2px; background: #FBFBFC; border-bottom: 1px solid var(--border); text-align: center; }
.pt-grid th b { display: block; font-size: 0.95rem; color: var(--text-main); letter-spacing: 0; }
.pt-grid thead tr.wk th { background: #F1F3F6; color: var(--text-main); font-size: 0.72rem; padding: 5px; border-left: 2px solid #fff; }
.pt-grid th.lab, .pt-grid td.lab { width: 270px; text-align: left; padding-left: 16px; position: sticky; left: 0; background: #fff; z-index: 2; border-right: 1px solid var(--border); }
.pt-grid th.lab { background: #FBFBFC; }
.pt-grid th.we, .pt-grid td.we { width: 20px; background: #E3E5E9 !important; padding: 0; }
.pt-grid th.we b { font-size: 0.6rem; }
.pt-grid th.today { background: #FFF6CC; color: var(--anthracite); box-shadow: inset 0 -3px 0 var(--fts-yellow); }
.pt-grid td { height: 54px; border-bottom: 1px solid var(--border); padding: 4px 3px; vertical-align: middle; text-align: center; cursor: pointer; }
.pt-grid td.today { background: #FFFDF2; }
.pt-grid tr:hover td { background: #FAFBFC; } .pt-grid tr:hover td.today { background: #FFFBEA; }
.pt-grid td.tot { font-weight: 800; background: #FBFBFC; cursor: default; font-size: 0.9rem; }
.pt-grid th.tot { width: 84px; }
.pt-grid tr.sec td { background: var(--anthracite) !important; color: var(--fts-yellow); font-size: 0.64rem; letter-spacing: 0.08em; font-weight: 800; height: auto; padding: 6px 16px; text-align: left; cursor: default; }
.pt-grid tr.sec.repli td { background: #3A3A3A !important; cursor: pointer; }
.pt-grid tr.sec.repli td .info { color: #B8BAC0; font-weight: 600; letter-spacing: 0; font-size: 0.72rem; }
.pt-grid tr.loc td { background: #FFFCF0; }
.lab .m { font-weight: 800; font-size: 0.86rem; display: block; }
.lab .c { font-size: 0.7rem; color: var(--text-sub); font-weight: 600; display: block; line-height: 1.3; }
.pt-add { display: none; width: 100%; height: 44px; border: 1.5px dashed #D5D8DE; border-radius: 7px; color: #9AA0AA; font-size: 1rem; align-items: center; justify-content: center; }
.pt-grid td.vide:hover .pt-add { display: flex; }
.pt-blk { border-radius: 7px; padding: 5px 8px; font-size: 0.72rem; line-height: 1.2; height: 44px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; border-left: 4px solid var(--cc); background: var(--cb); text-align: left; }
.pt-blk b { font-size: 0.74rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-blk span { color: #4B5563; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pt-blk.TRANSPORT, .pt-blk.ARRET, .pt-blk.PANNE { align-items: center; text-align: center; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.04em; }
.pt-blk.TRANSPORT { background: #EAF1FE; border-left-color: #4C82F0; color: #2A5DBF; }
.pt-blk.ARRET { background: #FFEDD5; border-left-color: #F59E0B; color: #B45309; }
.pt-blk.PANNE { background: #FDECEA; border-left-color: #C0392B; color: #C0392B; }
.pt-blk.TRANSPORT span, .pt-blk.ARRET span, .pt-blk.PANNE span { color: inherit; font-weight: 600; letter-spacing: 0; font-size: 0.64rem; }
.pt-plus { font-size: 0.6rem; font-weight: 800; color: var(--text-sub); }
.pt-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.pt-h { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 8px; border-radius: 7px; min-width: 70px; background: var(--bg); border-left: 3px solid var(--cc); margin: 1px; }
.pt-h b { font-size: 0.86rem; } .pt-h small { font-size: 0.64rem; color: var(--text-sub); font-weight: 700; }
.pt-empty { color: #C5C9D0; }
.pt-foot { padding: 10px 18px; font-size: 0.78rem; color: var(--text-sub); display: flex; justify-content: space-between; background: #FBFBFC; border-top: 1px solid var(--border); gap: 10px; flex-wrap: wrap; }

/* Récap par chantier */
.pt-rc .sv-ch { border-left: 5px solid var(--cc); }
.pt-rc .k { display: flex; gap: 16px; font-size: 0.8rem; color: var(--text-sub); flex-wrap: wrap; }
.pt-rc .k b { color: var(--text-main); }

/* Fenêtre d'édition d'une case */
.pt-ent { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.pt-ent:last-child { border-bottom: none; }
.pt-ent .q { font-size: 0.86rem; font-weight: 700; }
.pt-ent .q small { display: block; font-size: 0.72rem; color: var(--text-sub); font-weight: 600; }
.pt-ent .ed { grid-column: 1 / -1; display: none; gap: 8px; flex-wrap: wrap; align-items: center; }
.pt-ent.editing .ed { display: flex; }
.pt-traj { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pt-traj .bx { border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; background: #FAFAFA; min-width: 0; }
.pt-traj .lb { font-size: 0.66rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
.pt-traj .v { font-size: 1.15rem; font-weight: 800; margin-top: 2px; }
.pt-traj .v small { font-size: 0.76rem; font-weight: 600; color: var(--text-sub); }
.pt-traj .v.att { font-size: 0.9rem; color: var(--text-sub); font-weight: 600; }
.pt-traj .v.err { font-size: 0.9rem; color: #92400E; }
.pt-traj .d { font-size: 0.7rem; color: var(--text-sub); margin-top: 2px; overflow-wrap: anywhere; }
.pt-zone { display: inline-block; font-size: 0.8rem; font-weight: 800; border-radius: 999px; padding: 2px 10px; background: #DCFCE7; color: #166534; }
.pt-zone.z6 { background: #FEE2E2; color: #991B1B; }
.pt-zone.gd { background: var(--anthracite); color: var(--fts-yellow); }
@media (max-width: 520px) { .pt-traj { grid-template-columns: 1fr; } }
.pt-zbtn { border: 1px solid var(--border); background: #fff; border-radius: 9px; height: 40px; padding: 0 13px; font-weight: 700; font-size: 0.82rem; color: var(--anthracite); cursor: pointer; white-space: nowrap; }
.pt-zbtn[hidden] { display: none !important; }
.pt-zbtn.on { background: var(--anthracite); color: #fff; border-color: var(--anthracite); }
.pt-zbtn .chev { font-size: 0.7rem; margin-left: 2px; }
.pt-zpan { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; max-width: 620px; }
.pt-zpan[hidden] { display: none !important; }
.pt-zpan .zt { font-weight: 800; font-size: 0.92rem; }
.pt-zpan .zs { font-size: 0.76rem; color: var(--text-sub); margin-top: 2px; }
.pt-zpan table { width: 100%; border-collapse: collapse; font-size: 0.86rem; margin-top: 10px; }
.pt-zpan th, .pt-zpan td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
.pt-zpan th { font-size: 0.68rem; color: var(--text-sub); text-transform: uppercase; }
.pt-zpan td input { width: 72px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 7px; font: inherit; text-align: right; }
.pt-zpan .mute { color: var(--text-sub); }
.pt-zpan .zf { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; font-size: 0.76rem; color: var(--text-sub); }
.pt-zpan .lock { background: #F3F4F6; border-radius: 8px; padding: 6px 10px; }
.pt-zpan .zerr { color: #B91C1C; font-weight: 600; }
@media (max-width: 760px) { .pt-zbtn { width: 100%; } }
.pt-ent .ed input, .pt-ent .ed select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 0.86rem; }

/* Téléphone */
.pt-tel { margin: 30px 4px; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 26px 20px; text-align: center; }
.pt-tel[hidden] { display: none; }
.pt-tel .ic { font-size: 2.4rem; }
.pt-tel h2 { font-size: 1.1rem; margin: 10px 0 6px; }
.pt-tel p { font-size: 0.88rem; color: var(--text-sub); line-height: 1.5; margin: 0 0 18px; }
.pt-tel .sv-btn { display: block; width: 100%; padding: 12px; margin-top: 8px; text-decoration: none; text-align: center; }
body.pt-bloque #svPage > :not(#ptTel) { display: none !important; }
.pt-mob { display: none; }
@media (max-width: 760px) {
  .pt-dsk { display: none !important; }
  .pt-mob { display: block; }
  .pt-bar { gap: 8px; }
  .pt-wnav { width: 100%; justify-content: space-between; }
  .pt-wnav .lbl small { display: block; margin: 0; }
  .pt-seg { width: 100%; } .pt-seg button { flex: 1; padding: 8px 4px; }
  .pt-fld { width: 100%; }
  .pt-day { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .pt-day.today { border-color: var(--fts-yellow); box-shadow: 0 0 0 1px var(--fts-yellow); }
  .pt-day .dh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; font-weight: 800; font-size: 0.9rem; }
  .pt-day .dh small { color: var(--text-sub); font-weight: 600; margin-left: auto; font-size: 0.76rem; }
  .pt-day .dh .pill { background: var(--fts-yellow); border-radius: 10px; padding: 1px 8px; font-size: 0.7rem; }
  .pt-day.vide { border-style: dashed; background: transparent; }
  .pt-day.vide .dh { color: var(--text-sub); font-weight: 700; }
  .pt-mblk { border-top: 1px solid var(--border); padding: 8px 14px 10px; border-left: 4px solid var(--cc); }
  .pt-mblk .t { font-size: 0.72rem; font-weight: 800; color: var(--text-sub); margin-bottom: 4px; }
  .pt-ln { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 0.88rem; cursor: pointer; }
  .pt-ln .n { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pt-mh { font-size: 0.68rem; letter-spacing: 0.08em; font-weight: 800; color: var(--text-sub); margin: 16px 2px 8px; }
  .pt-at { background: #fff; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 12px 14px; }
  .pt-at .m { font-weight: 800; font-size: 0.92rem; } .pt-at .c { font-size: 0.74rem; color: var(--text-sub); font-weight: 600; }
  .pt-at .now { margin-top: 8px; } .pt-at .now .pt-blk { height: auto; padding: 8px 10px; }
  .pt-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
  .pt-strip div { text-align: center; font-size: 0.6rem; color: var(--text-sub); font-weight: 700; cursor: pointer; }
  .pt-strip i { display: block; height: 8px; border-radius: 3px; margin-top: 3px; background: #EEF0F2; }
  .pt-strip .t { color: var(--anthracite); }
  .pt-libre { border: 1.5px dashed #D5D8DE; border-radius: 12px; padding: 10px 14px; font-size: 0.82rem; font-weight: 700; color: var(--text-sub); margin-bottom: 10px; cursor: pointer; }
  .pt-rp { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.86rem; }
  .pt-rp .n { flex: 1; font-weight: 700; } .pt-rp .n small { display: block; font-weight: 600; color: var(--text-sub); font-size: 0.72rem; }
  .pt-rp .hh { font-weight: 800; font-size: 1rem; }
  .pt-rp .gdn { font-size: 0.72rem; color: var(--text-sub); min-width: 44px; text-align: right; }
  .pt-rc .sv-tbl .c-rep { display: none; }
}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(location.search);
  const estMateriel = params.get("type") === "materiel";
  const onglet = estMateriel ? "Materiel" : "Personnel";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => FTSShell.esc(s);
  const nb = (v) => parseFloat(String(v == null ? "" : v).replace(",", ".")) || 0;
  const fmt = (n, d = 0) => Number(n).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const parseFR = (s) => { const [j, m, a] = String(s || "").split("/"); return j && m && a ? new Date(+a, +m - 1, +j) : null; };
  const frDate = (d) => `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
  const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const jour0 = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const ajoute = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const lundi = (d) => { const x = jour0(d); const j = x.getDay(); x.setDate(x.getDate() + (j === 0 ? -6 : 1 - j)); return x; };
  const numSemaine = (d) => { const t = jour0(d); t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7)); const s = new Date(t.getFullYear(), 0, 4); return 1 + Math.round(((t - s) / 86400000 - 3 + ((s.getDay() + 6) % 7)) / 7); };
  const cleNom = (s) => (window.FTSPersonnel ? FTSPersonnel.cle(s) : String(s || "").toUpperCase().trim());
  const STATUTS = ["TRAVAIL", "PANNE", "ARRET", "TRANSPORT"];
  const LIB_ST = { TRAVAIL: "Travail", PANNE: "Panne", ARRET: "Arrêt", TRANSPORT: "Transport" };
  const pref = (k, def) => { try { return localStorage.getItem("fts_pt_" + k) || def; } catch (e) { return def; } };
  const setPref = (k, v) => { try { localStorage.setItem("fts_pt_" + k, v); } catch (e) {} };

  document.title = estMateriel ? "FTS — Pointage matériel" : "FTS — Pointage personnel";
  // ─── État ──────────────────────────────────────────────────────
  const CLE_CACHE = "fts_supervision_cache_v1"; // même lecture groupée que la Vue d'ensemble
  let donnees = null;
  let fraiches = false;
  let enCours = null;
  let vue = estMateriel ? pref("vue", "planning") : "planning";
  let famille = pref("fam", "tous");
  let nbSemaines = estMateriel ? Number(pref("sem", "2")) : 1;
  let debut = lundi(new Date());
  if (estMateriel && nbSemaines === 2) debut = ajoute(lundi(new Date()), -7); // semaine passée + semaine en cours
  let autresOuverts = pref("autres", "0") === "1";
  const COMPTE_ZONES = "conducfts@gmail.com"; // comparé sans les points (Gmail les ignore)
  const emailNorm = (m) => String(m || "").trim().toLowerCase().replace(/\.(?=[^@]*@gmail\.com$)/g, "");
  let zonesOuvert = false, zonesEdition = null;

  try { const c = JSON.parse(localStorage.getItem(CLE_CACHE)); if (c && Array.isArray(c.chantiers)) donnees = c; } catch (e) {}

  async function charger(forcer = false) {
    if (!window.FTSAuth || !FTSAuth.isSignedIn()) { afficher(); return; }
    if (enCours) return enCours;
    if (!forcer && fraiches && donnees && Date.now() - donnees.savedAt < 60000) { afficher(); return; }
    $("ptStatus").textContent = donnees ? "" : "Chargement…";
    $("majTxt").textContent = "Actualisation…";
    afficher();
    enCours = (async () => {
      try {
        // Parc / Personnel en parallèle, sans bloquer : ré-affichage à l'arrivée
        Promise.all([
          window.FTSParc ? FTSParc.charger({ rapide: true }).catch(() => {}) : null,
          window.FTSPersonnel ? FTSPersonnel.charger({ rapide: true }).catch(() => {}) : null,
        ]).then(() => { if (!enCours) { remplirListes(); afficher(); } });
        const chantiers = (await FTSDrive.listChantiersAvecMeta()).map((c) => ({ id: c.id, name: c.name, meta: c.meta }));
        const suivis = await FTSSheets.chargerDonneesSupervision(chantiers);
        donnees = { savedAt: Date.now(), chantiers, suivis };
        fraiches = true;
        try { localStorage.setItem(CLE_CACHE, JSON.stringify(donnees)); } catch (e) {}
        $("ptStatus").textContent = "";
        $("ptStatus").classList.remove("err");
      } catch (err) {
        console.error("Pointage :", err);
        $("ptStatus").textContent = `Erreur : ${err.message}`;
        $("ptStatus").classList.add("err");
      } finally {
        enCours = null;
        remplirListes();
        afficher();
      }
    })();
    return enCours;
  }

  function majTexte() {
    if (enCours) return;
    if (!donnees) { $("majTxt").textContent = ""; return; }
    const min = Math.floor((Date.now() - donnees.savedAt) / 60000);
    $("majTxt").innerHTML = `${min < 1 ? "Mis à jour à l'instant" : min < 60 ? `Mis à jour il y a ${min} min` : "Mis à jour le " + new Date(donnees.savedAt).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })} · <a href="#" id="refreshLnk">🔄 Actualiser</a>`;
    const l = $("refreshLnk"); if (l) l.onclick = (e) => { e.preventDefault(); charger(true); };
  }
  setInterval(majTexte, 30000);

  function remplirListes() {
    if (window.FTSParc) $("dlMachines").innerHTML = FTSParc.disponibles().map((m) => `<option value="${esc(m.nom)}">`).join("") + FTSParc.location().map((l) => `<option value="${esc(l)}">`).join("");
    if (window.FTSPersonnel) $("dlNoms").innerHTML = FTSPersonnel.actifs().map((p) => `<option value="${esc(FTSPersonnel.nomComplet(p))}">`).join("");
  }

  // ─── Données mises à plat ─────────────────────────────────────
  const famChantier = (meta) => { const t = FTSDrive.techniquesChantier(meta || {}); return { mp: t.includes("Micropieux") || t.includes("Battage"), px: t.includes("Pieux") }; };
  const dansFamille = (f) => famille === "tous" || (famille === "mp" ? f.mp : f.px);
  const PALETTE = [["#8B5CF6", "#F3EEFF"], ["#0EA5E9", "#E7F6FD"], ["#22A06B", "#E7F6EE"], ["#F59E0B", "#FEF5E3"], ["#6366F1", "#EEEFFE"], ["#E2557A", "#FDECF1"], ["#14B8A6", "#E3F7F5"], ["#A16207", "#FBF3E1"]];
  let couleurs = {};
  const couleur = (nomCh) => { if (!couleurs[nomCh]) couleurs[nomCh] = PALETTE[Object.keys(couleurs).length % PALETTE.length]; return couleurs[nomCh]; };
  const codeDe = (n) => String(n).split(/\s+/)[0];
  const villeDe = (n) => String(n).split(/\s+/).slice(1, 2).join(" ");
  const resteDe = (n) => String(n).split(/\s+/).slice(2).join(" ").toLowerCase().replace(/^./, (c) => c.toUpperCase());

  function entrees() {
    if (!donnees) return [];
    const out = [];
    donnees.chantiers.forEach((c, i) => {
      const s = donnees.suivis[i];
      if (!s || !s.spreadsheetId) return;
      const f = famChantier(c.meta);
      const chefDuJour = {};
      (s.production || []).forEach((r) => { if (r[4]) chefDuJour[r[0]] = r[4]; });
      (estMateriel ? s.materiel : s.personnel).forEach((r, idx) => {
        const d = parseFR(r[0]);
        if (!d) return;
        out.push({ chantierId: c.id, chantierName: c.name, spreadsheetId: s.spreadsheetId, sheetRow: idx + 2, cols: r, date: d, fr: r[0], fam: f, chef: chefDuJour[r[0]] || "" });
      });
    });
    return out;
  }

  function joursPeriode() {
    const n = estMateriel ? nbSemaines * 7 : 6;
    return Array.from({ length: n }, (_, i) => ajoute(debut, i)).filter((d) => estMateriel || d.getDay() !== 0);
  }

  // ─── Affichage principal ──────────────────────────────────────
  function afficher() {
    couleurs = {};
    afficherZones();
    majTexte();
    $("vueSeg").hidden = !estMateriel;
    $("dureeSeg").hidden = !estMateriel;
    document.querySelectorAll("#vueSeg button").forEach((b) => b.classList.toggle("on", b.dataset.v === vue));
    document.querySelectorAll("#famSeg button").forEach((b) => b.classList.toggle("on", b.dataset.f === famille));
    document.querySelectorAll("#dureeSeg button").forEach((b) => b.classList.toggle("on", Number(b.dataset.n) === nbSemaines));
    document.querySelector(".pt-only-planning").style.display = vue === "planning" ? "contents" : "none";
    document.querySelector(".pt-only-recap").style.display = vue === "recap" ? "contents" : "none";
    const jours = joursPeriode();
    const fin = jours[jours.length - 1];
    const s1 = numSemaine(debut), s2 = numSemaine(fin);
    $("periodeLbl").innerHTML = `Semaine${s1 !== s2 ? "s" : ""} ${s1}${s1 !== s2 ? " – " + s2 : ""}<small>${debut.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })} → ${fin.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" })}</small>`;

    if (!donnees) {
      const connecte = window.FTSAuth && FTSAuth.isSignedIn();
      $("ptDesk").innerHTML = $("ptMob").innerHTML = `<div class="sv-vide">${connecte ? "Chargement des pointages…" : "Connecte-toi pour afficher les pointages."}</div>`;
      return;
    }
    const toutes = entrees().filter((e) => dansFamille(e.fam));
    if (!estMateriel) return afficherPersonnel(toutes, jours);
    if (vue === "recap") return afficherRecap(toutes);
    afficherPlanning(toutes, jours);
  }

  // ═══ PERSONNEL ════════════════════════════════════════════════
  function afficherPersonnel(toutes, jours) {
    const frs = new Set(jours.map(frDate));
    const sem = toutes.filter((e) => frs.has(e.fr));
    if (famille === "px" && !sem.length) {
      $("ptDesk").innerHTML = $("ptMob").innerHTML = `<div class="sv-vide">🏛️ Aucune heure sur un chantier pieux sur cette période — elles apparaîtront ici dès que le rapport journalier pieux sera en place.</div>`;
      return;
    }
    // Personnes : nom saisi par le chef, rapproché sans casse / accents / ordre
    const pers = new Map();
    sem.forEach((e) => {
      const k = cleNom(e.cols[1]);
      if (!k) return;
      if (!pers.has(k)) pers.set(k, { k, nom: String(e.cols[1]).toUpperCase(), interim: false, parJour: {} });
      const p = pers.get(k);
      if (e.cols[2] === "Intérim") p.interim = true;
      (p.parJour[e.fr] = p.parJour[e.fr] || []).push(e);
    });
    const liste = [...pers.values()].sort((a, b) => a.nom.localeCompare(b.nom));
    const fts = liste.filter((p) => !p.interim), it = liste.filter((p) => p.interim);
    const aujFR = frDate(new Date());
    [...new Set(sem.map((e) => e.chantierName))].sort().forEach(couleur);

    // Ordinateur : grille
    const tete = `<tr><th class="lab">Personne</th>${jours.map((d) => `<th class="${frDate(d) === aujFR ? "today" : ""}">${d.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "")}<b>${String(d.getDate()).padStart(2, "0")}</b></th>`).join("")}<th class="tot">Heures</th><th class="tot" style="width:60px">GD</th></tr>`;
    const ligne = (p) => {
      let h = 0, gd = 0;
      const cells = jours.map((d) => {
        const fr = frDate(d), l = p.parJour[fr] || [];
        l.forEach((e) => { h += nb(e.cols[4]); });
        if (l.some((e) => e.cols[3] === "GD")) gd++;
        const contenu = l.length ? l.map((e) => `<span class="pt-h" style="--cc:${couleur(e.chantierName)[0]}"><b>${e.cols[4] ? fmt(nb(e.cols[4]), 1).replace(",0", "") + " h" : "—"}${e.cols[3] === "GD" ? '<span class="sv-gd">GD</span>' : ""}</b><small>${esc(codeDe(e.chantierName))}</small></span>`).join("") : `<div class="pt-add">+</div>`;
        return `<td class="${l.length ? "" : "vide"} ${fr === aujFR ? "today" : ""}" data-p="${esc(p.k)}" data-d="${fr}">${contenu}</td>`;
      }).join("");
      return `<tr><td class="lab"><span class="m">${esc(p.nom)}${p.interim ? '<span class="sv-int">INTÉRIM</span>' : ""}</span></td>${cells}<td class="tot">${fmt(h, 1).replace(",0", "")} h</td><td class="tot">${gd || "—"}</td></tr>`;
    };
    let corps = fts.map(ligne).join("");
    if (it.length) corps += `<tr class="sec"><td class="lab">PERSONNEL INTÉRIM</td><td colspan="${jours.length + 2}"></td></tr>` + it.map(ligne).join("");
    if (!liste.length) corps = `<tr><td colspan="${jours.length + 3}" style="padding:30px;color:var(--text-sub);cursor:default">Aucun pointage personnel sur cette semaine.</td></tr>`;
    const leg = [...new Set(sem.map((e) => e.chantierName))].map((n) => `<span><i style="background:${couleur(n)[0]}"></i>${esc(codeDe(n))} ${esc(villeDe(n))}</span>`).join("");
    $("ptDesk").innerHTML = `<section class="sv-card"><div class="pt-scroll"><table class="pt-grid"><thead>${tete}</thead><tbody>${corps}</tbody></table></div>
      <div class="pt-foot"><span>Total de la semaine par personne à droite (heures et jours de GD) · clic sur une case pour modifier</span><span class="pt-leg">${leg}</span></div></section>`;
    $("ptDesk").querySelectorAll("td[data-d]").forEach((td) => td.addEventListener("click", () => {
      const p = pers.get(td.dataset.p);
      const l = (p && p.parJour[td.dataset.d]) || [];
      if (l.length) ouvrirEdition(l, `${p.nom} — ${td.dataset.d}`, { nom: p.nom, date: td.dataset.d });
      else ouvrirAjout({ nom: p ? p.nom : "", date: td.dataset.d });
    }));

    // Téléphone : un bloc par jour + récap de la semaine
    let m = "";
    jours.forEach((d) => {
      const fr = frDate(d), l = sem.filter((e) => e.fr === fr);
      const tag = fr === aujFR ? `<span class="pill">Aujourd'hui</span>` : "";
      const lib = d.toLocaleDateString("fr-FR", { weekday: "long" });
      if (!l.length) { m += `<div class="pt-day vide ${fr === aujFR ? "today" : ""}"><div class="dh">${lib.charAt(0).toUpperCase() + lib.slice(1, 3)}. ${String(d.getDate()).padStart(2, "0")} ${tag}<small>aucune activité</small></div></div>`; return; }
      const parCh = {};
      l.forEach((e) => (parCh[e.chantierName] = parCh[e.chantierName] || []).push(e));
      m += `<div class="pt-day ${fr === aujFR ? "today" : ""}"><div class="dh">${lib.charAt(0).toUpperCase() + lib.slice(1)} ${String(d.getDate()).padStart(2, "0")} ${tag}<small>${l.length} personne${l.length > 1 ? "s" : ""}</small></div>` +
        Object.entries(parCh).map(([n, es]) => `<div class="pt-mblk" style="--cc:${couleur(n)[0]}"><div class="t">${esc(n)}</div>${es.map((e) => `<div class="pt-ln" data-k="${e.spreadsheetId}|${e.sheetRow}"><span class="n">${esc(e.cols[1])}${e.cols[2] === "Intérim" ? ' <span class="sv-int">INT</span>' : ""}</span>${e.cols[3] === "GD" ? '<span class="sv-gd">GD</span>' : ""}<b>${e.cols[4] ? fmt(nb(e.cols[4]), 1).replace(",0", "") + " h" : "—"}</b></div>`).join("")}</div>`).join("") + `</div>`;
    });
    if (liste.length) {
      m += `<div class="sv-card" style="margin-top:16px"><div class="sv-ch"><h2>Récapitulatif de la semaine</h2></div>` + liste.map((p) => {
        const es = Object.values(p.parJour).flat();
        const h = es.reduce((s, e) => s + nb(e.cols[4]), 0), gd = Object.values(p.parJour).filter((l) => l.some((e) => e.cols[3] === "GD")).length;
        return `<div class="pt-rp"><span class="n">${esc(p.nom)}${p.interim ? ' <span class="sv-int">INT</span>' : ""}<small>${[...new Set(es.map((e) => codeDe(e.chantierName)))].join(" · ")}</small></span><span class="gdn">${gd ? gd + " GD" : ""}</span><span class="hh">${fmt(h, 1).replace(",0", "")} h</span></div>`;
      }).join("") + `</div>`;
    }
    $("ptMob").innerHTML = m;
    $("ptMob").querySelectorAll(".pt-ln[data-k]").forEach((el) => el.addEventListener("click", () => {
      const e = sem.find((x) => `${x.spreadsheetId}|${x.sheetRow}` === el.dataset.k);
      if (e) ouvrirEdition([e], `${e.cols[1]} — ${e.fr}`, {});
    }));
  }

  // ═══ MATÉRIEL : planning par machine ══════════════════════════
  function lignesPlanning(toutes) {
    const lignes = new Map();
    FTSAteliers.lignesDuParc().forEach((g) => lignes.set(g.cle, { ...g, parJour: {}, chantiersLoc: new Set() }));
    toutes.forEach((e) => {
      const g = FTSAteliers.groupeDePointage(e.cols[1], e.cols[4], e.cols[3], e.chef);
      if (!lignes.has(g.cle)) lignes.set(g.cle, { ...g, parJour: {}, chantiersLoc: new Set() });
      const L = lignes.get(g.cle);
      (L.parJour[e.fr] = L.parJour[e.fr] || []).push(e);
      if (g.section === "loc") L.chantiersLoc.add(e.chantierName);
    });
    return lignes;
  }

  // Ce que fait une ligne un jour donné : statut combiné + chantier principal
  function etatDuJour(l) {
    if (!l || !l.length) return null;
    const st = FTSAteliers.statutDuJour(l.map((e) => e.cols[2]));
    const parCh = {};
    l.forEach((e) => { parCh[e.chantierName] = (parCh[e.chantierName] || 0) + (String(e.cols[2]).toUpperCase() === st ? 2 : 1); });
    const chantiers = Object.keys(parCh).sort((a, b) => parCh[b] - parCh[a]);
    return { st, ch: chantiers[0], autres: chantiers.length - 1 };
  }

  function bloc(et, span) {
    const [cc, cb] = couleur(et.ch);
    const plus = et.autres ? ` <span class="pt-plus">+${et.autres}</span>` : "";
    if (et.st === "TRAVAIL" || !et.st) return `<div class="pt-blk" style="--cc:${cc};--cb:${cb}"><b>${esc(codeDe(et.ch))} ${esc(villeDe(et.ch))}${plus}</b><span>${esc(resteDe(et.ch))}${span > 1 ? ` · ${span} j` : ""}</span></div>`;
    return `<div class="pt-blk ${esc(et.st)}">${LIB_ST[et.st] ? LIB_ST[et.st].toUpperCase() : esc(et.st)}<span>${et.st === "TRANSPORT" ? "→ " : ""}${esc(codeDe(et.ch))} ${esc(villeDe(et.ch))}${plus}</span></div>`;
  }

  function afficherPlanning(toutes, jours) {
    const frs = new Set(jours.map(frDate));
    const periode = toutes.filter((e) => frs.has(e.fr));
    const lignes = lignesPlanning(periode);
    [...new Set(periode.map((e) => e.chantierName))].sort().forEach(couleur);
    const aujFR = frDate(new Date());
    const sectionsVisibles = FTSAteliers.SECTIONS.filter((s) => famille === "tous" || s.fam === "tous" || s.fam === famille);
    const enTetes = (() => {
      let wk = `<tr class="wk"><th class="lab"></th>`, j = `<tr><th class="lab">Machine</th>`;
      for (let i = 0; i < jours.length; i += 7) {
        const ouvres = jours.slice(i, i + 7).filter((d) => d.getDay() !== 0 && d.getDay() !== 6).length;
        wk += `<th colspan="${ouvres}">SEMAINE ${numSemaine(jours[i])}</th><th class="we"></th><th class="we"></th>`;
      }
      jours.forEach((d) => {
        const we = d.getDay() === 0 || d.getDay() === 6;
        j += we ? `<th class="we">${d.getDay() === 6 ? "S" : "D"}<b>${d.getDate()}</b></th>` : `<th class="${frDate(d) === aujFR ? "today" : ""}">${d.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "")}<b>${d.getDate()}</b></th>`;
      });
      return wk + `</tr>` + j + `</tr>`;
    })();
    const ligneHtml = (L) => {
      const sous = L.section === "loc" ? `Loué pour ${[...L.chantiersLoc].map((n) => `<b>${esc(codeDe(n))} ${esc(villeDe(n))}</b>`).join(", ")}` : esc(L.sous || "");
      let h = `<tr class="${L.section === "loc" ? "loc" : ""}"><td class="lab"><span class="m">${esc(L.libelle)}</span>${sous ? `<span class="c">${sous}</span>` : ""}</td>`;
      for (let i = 0; i < jours.length; i++) {
        const d = jours[i], fr = frDate(d), we = d.getDay() === 0 || d.getDay() === 6;
        const et = etatDuJour(L.parJour[fr]);
        if (we) { h += `<td class="we" data-l="${esc(L.cle)}" data-d="${fr}" title="${et ? esc(LIB_ST[et.st] + " — " + et.ch) : ""}">${et ? `<span class="pt-dot" style="background:${et.st === "TRAVAIL" ? couleur(et.ch)[0] : et.st === "PANNE" ? "#C0392B" : et.st === "ARRET" ? "#F59E0B" : "#4C82F0"}"></span>` : ""}</td>`; continue; }
        if (!et) { h += `<td class="vide ${fr === aujFR ? "today" : ""}" data-l="${esc(L.cle)}" data-d="${fr}"><div class="pt-add">+</div></td>`; continue; }
        let span = 1;
        if (et.st === "TRAVAIL" && !et.autres) {
          while (i + span < jours.length) {
            const d2 = jours[i + span];
            if (d2.getDay() === 0 || d2.getDay() === 6) break;
            const e2 = etatDuJour(L.parJour[frDate(d2)]);
            if (!e2 || e2.st !== "TRAVAIL" || e2.ch !== et.ch || e2.autres) break;
            span++;
          }
        }
        const tod = jours.slice(i, i + span).some((x) => frDate(x) === aujFR) ? "today" : "";
        h += `<td colspan="${span}" class="${tod}" data-l="${esc(L.cle)}" data-d="${fr}" data-span="${span}">${bloc(et, span)}</td>`;
        i += span - 1;
      }
      return h + `</tr>`;
    };
    let corps = "";
    sectionsVisibles.forEach((s) => {
      const ls = [...lignes.values()].filter((L) => L.section === s.id);
      if (s.id === "loc" && !ls.length) return;
      if (s.repliable) {
        const actives = ls.filter((L) => Object.keys(L.parJour).length).length;
        corps += `<tr class="sec repli" data-sec="autre"><td class="lab">${autresOuverts ? "▾" : "▸"} ${s.titre} · ${ls.length}</td><td colspan="${jours.length}"><span class="info">${autresOuverts ? "clic pour replier" : `compresseur, pelles, Pajot, pompes, dessableur… — clic pour déplier · ${actives} en activité sur la période`}</span></td></tr>`;
        if (autresOuverts) corps += ls.map(ligneHtml).join("");
        return;
      }
      corps += `<tr class="sec"><td class="lab">${s.titre}${s.id === "pieux" ? " · RAPPORT PIEUX À VENIR" : ""}</td><td colspan="${jours.length}"></td></tr>` + ls.map(ligneHtml).join("");
    });
    const largeur = 270 + jours.filter((d) => d.getDay() % 6 !== 0).length * (nbSemaines >= 4 ? 64 : 96) + jours.filter((d) => d.getDay() % 6 === 0).length * 20;
    $("ptDesk").innerHTML = `<section class="sv-card"><div class="pt-scroll"><table class="pt-grid" style="min-width:${largeur}px"><thead>${enTetes}</thead><tbody>${corps}</tbody></table></div>
      <div class="pt-foot"><span class="pt-leg"><span><i style="background:#E8F0FF;border-left:3px solid #4C82F0"></i>Sur chantier (couleur = chantier)</span><span><i style="background:#EAF1FE"></i>Transport</span><span><i style="background:#FFEDD5"></i>Arrêt</span><span><i style="background:#FDECEA"></i>Panne</span></span><span>Clic sur une case pour modifier · case vide = ajouter</span></div></section>`;
    const repli = $("ptDesk").querySelector("tr.sec.repli");
    if (repli) repli.addEventListener("click", () => { autresOuverts = !autresOuverts; setPref("autres", autresOuverts ? "1" : "0"); afficher(); });
    $("ptDesk").querySelectorAll("td[data-l]").forEach((td) => td.addEventListener("click", () => ouvrirCase(lignes.get(td.dataset.l), td.dataset.d, Number(td.dataset.span || 1), jours)));

    // Téléphone : une carte par machine active (semaine en cours de la période)
    const sem = jours.filter((d) => d >= lundi(jours[jours.length - 1]) && d.getDay() !== 0);
    const refJour = sem.find((d) => frDate(d) === aujFR) || sem[0];
    const couleurEt = (et) => !et ? "#EEF0F2" : et.st === "TRAVAIL" ? couleur(et.ch)[0] : et.st === "PANNE" ? "#C0392B" : et.st === "ARRET" ? "#F59E0B" : "#4C82F0";
    let m = "";
    sectionsVisibles.forEach((s) => {
      const ls = [...lignes.values()].filter((L) => L.section === s.id);
      const actives = ls.filter((L) => sem.some((d) => L.parJour[frDate(d)]));
      if (!ls.length || (s.id === "loc" && !actives.length)) return;
      m += `<div class="pt-mh">${s.titre}</div>` + actives.map((L) => {
        const et = etatDuJour(L.parJour[frDate(refJour)]);
        return `<div class="pt-at" data-l="${esc(L.cle)}"><div class="m">${esc(L.libelle)}</div>${L.sous ? `<div class="c">${esc(L.sous)}</div>` : ""}
          <div class="now">${et ? bloc(et, 1) : `<div style="font-size:.78rem;color:var(--text-sub);padding:6px 0">Rien ${frDate(refJour) === aujFR ? "aujourd'hui" : "ce jour-là"}</div>`}</div>
          <div class="pt-strip">${sem.map((d) => `<div class="${frDate(d) === aujFR ? "t" : ""}" data-d="${frDate(d)}">${d.toLocaleDateString("fr-FR", { weekday: "narrow" })}${d.getDate()}<i style="background:${couleurEt(etatDuJour(L.parJour[frDate(d)]))}"></i></div>`).join("")}</div></div>`;
      }).join("") + (ls.length - actives.length && s.id !== "loc" ? `<div class="pt-libre">${ls.length - actives.length} sans activité cette semaine</div>` : "");
    });
    $("ptMob").innerHTML = m || `<div class="sv-vide">Aucun pointage matériel sur cette période.</div>`;
    $("ptMob").querySelectorAll(".pt-at").forEach((c) => c.querySelectorAll(".pt-strip div").forEach((dv) => dv.addEventListener("click", () => ouvrirCase(lignes.get(c.dataset.l), dv.dataset.d, 1, jours))));
  }

  function ouvrirCase(L, fr, span, jours) {
    if (!L) return;
    const i0 = jours.findIndex((d) => frDate(d) === fr);
    const frs = jours.slice(i0, i0 + span).map(frDate);
    const l = frs.flatMap((f) => L.parJour[f] || []);
    const titre = `${L.libelle} — ${span > 1 ? `du ${frs[0].slice(0, 5)} au ${frs[frs.length - 1].slice(0, 5)}` : fr}`;
    if (!l.length) return ouvrirAjout({ machine: machineParDefaut(L), date: fr });
    ouvrirEdition(l, titre, { machine: machineParDefaut(L), date: fr });
  }
  function machineParDefaut(L) {
    if (L.section === "loc" || L.cle.startsWith("X|")) return L.libelle;
    if (L.cle.startsWith("M|") && window.FTSParc) { const m = FTSParc.parNumero(L.cle.slice(2)); return m ? m.nom : L.libelle; }
    return L.sous ? L.sous.split(" · ")[0] : L.libelle;
  }

  // ═══ MATÉRIEL : récap par chantier ════════════════════════════
  function bornesRecap() {
    const p = $("periodeSel").value, n = new Date();
    if (p === "mois") return [new Date(n.getFullYear(), n.getMonth(), 1), new Date(n.getFullYear(), n.getMonth() + 1, 0)];
    if (p === "moisPrec") return [new Date(n.getFullYear(), n.getMonth() - 1, 1), new Date(n.getFullYear(), n.getMonth(), 0)];
    if (p === "semaine") return [lundi(n), ajoute(lundi(n), 6)];
    if (p === "perso") { const a = $("du").value, b = $("au").value; return [a ? new Date(a + "T00:00:00") : null, b ? new Date(b + "T00:00:00") : null]; }
    return [null, null];
  }

  function afficherRecap(toutes) {
    const [d1, d2] = bornesRecap();
    const q = $("recherche").value.trim().toLowerCase();
    const sel = toutes.filter((e) => (!d1 || e.date >= d1) && (!d2 || e.date <= d2) && (!q || e.chantierName.toLowerCase().includes(q)));
    const parCh = new Map();
    sel.forEach((e) => { if (!parCh.has(e.chantierId)) parCh.set(e.chantierId, []); parCh.get(e.chantierId).push(e); });
    const noms = [...parCh.keys()].map((id) => donnees.chantiers.find((c) => c.id === id)).filter(Boolean).sort((a, b) => a.name.localeCompare(b.name));
    noms.forEach((c) => couleur(c.name));
    const html = noms.map((c) => {
      const es = parCh.get(c.id);
      const i = donnees.chantiers.indexOf(c);
      const prodDates = new Set((donnees.suivis[i].production || []).map((r) => r[0]).filter((x) => { const d = parseFR(x); return d && (!d1 || d >= d1) && (!d2 || d <= d2); }));
      const dates = es.map((e) => e.date).sort((a, b) => a - b);
      const groupes = new Map();
      es.forEach((e) => {
        const g = FTSAteliers.groupeDePointage(e.cols[1], e.cols[4], e.cols[3], e.chef);
        if (!groupes.has(g.cle)) groupes.set(g.cle, { ...g, parJour: {} });
        (groupes.get(g.cle).parJour[e.fr] = groupes.get(g.cle).parJour[e.fr] || []).push(e.cols[2]);
      });
      const ordre = (id) => FTSAteliers.SECTIONS.findIndex((s) => s.id === id);
      const gs = [...groupes.values()].sort((a, b) => (ordre(a.section) - ordre(b.section)) || a.libelle.localeCompare(b.libelle, "fr", { numeric: true }));
      const tot = { TRAVAIL: 0, PANNE: 0, ARRET: 0, TRANSPORT: 0 };
      let locFait = false;
      const cell = (v, k) => `<td class="r"><span class="sv-n ${v ? k : "z"}">${v ? v + " j" : "—"}</span></td>`;
      const lignes = gs.map((g) => {
        const n = { TRAVAIL: 0, PANNE: 0, ARRET: 0, TRANSPORT: 0 };
        Object.values(g.parJour).forEach((s) => { const st = FTSAteliers.statutDuJour(s); if (n[st] !== undefined) { n[st]++; tot[st]++; } });
        const t = n.TRAVAIL + n.PANNE + n.ARRET + n.TRANSPORT || 1;
        let sep = "";
        if (g.section === "loc" && !locFait) { sep = `<tr class="sep"><td colspan="7">MATÉRIEL LOCATION</td></tr>`; locFait = true; }
        return sep + `<tr class="${g.section === "loc" ? "loc" : ""}"><td><b>${esc(g.libelle)}</b>${g.sous ? `<span class="sub">${esc(g.sous)}</span>` : ""}</td>${cell(n.TRAVAIL, "t")}${cell(n.PANNE, "p")}${cell(n.ARRET, "a")}${cell(n.TRANSPORT, "tr")}
          <td class="r"><b>${n.TRAVAIL + n.PANNE + n.ARRET + n.TRANSPORT} j</b></td><td class="r c-rep"><div class="sv-stack"><div style="width:${n.TRAVAIL / t * 100}%;background:#27AE60"></div><div style="width:${n.PANNE / t * 100}%;background:#C0392B"></div><div style="width:${n.ARRET / t * 100}%;background:#F59E0B"></div><div style="width:${n.TRANSPORT / t * 100}%;background:#4C82F0"></div></div></td></tr>`;
      }).join("");
      const tech = FTSDrive.techniquesChantier(c.meta || {});
      return `<section class="sv-card pt-rc"><div class="sv-ch" style="--cc:${couleur(c.name)[0]}"><div><h2>${esc(codeDe(c.name))} — ${esc(c.name.split(/\s+/).slice(1).join(" "))} ${tech.map((t) => `<span class="sv-badge sv-b-${esc(t)}" style="vertical-align:2px">${esc(t)}</span>`).join(" ")}</h2>
        <div class="s">Période : du ${frDate(dates[0]).slice(0, 5)} au ${frDate(dates[dates.length - 1]).slice(0, 5)} · ${prodDates.size} jour${prodDates.size > 1 ? "s" : ""} de rapport</div></div><span class="sv-sp"></span>
        <div class="k"><span>Travail <b>${tot.TRAVAIL} j</b></span><span>Panne <b>${tot.PANNE} j</b></span><span>Arrêt <b>${tot.ARRET} j</b></span><span>Transport <b>${tot.TRANSPORT} j</b></span></div>
        <a class="sv-btn" style="text-decoration:none" href="../detail-chantier/index.html?id=${encodeURIComponent(c.id)}&name=${encodeURIComponent(c.name)}#materiel">Voir le chantier →</a></div>
        <table class="sv-tbl"><thead><tr><th>Machine</th><th class="r">Travail</th><th class="r">Panne</th><th class="r">Arrêt</th><th class="r">Transport</th><th class="r">Total</th><th class="r c-rep" style="width:210px">Répartition</th></tr></thead><tbody>${lignes}</tbody></table></section>`;
    }).join("");
    const vide = famille === "px"
      ? `<div class="sv-vide">🏛️ Aucun chantier pieux pour l'instant — les jours matériel pieux apparaîtront ici dès que le rapport journalier pieux sera en place.</div>`
      : `<div class="sv-vide">Aucun pointage matériel sur cette période${q ? " pour cette recherche" : ""}.</div>`;
    $("ptDesk").innerHTML = html || vide;
    $("ptMob").innerHTML = html || vide;
  }

  // ═══ Ajout / modification / suppression ═══════════════════════
  function machinePointage(saisie, ftsLocSaisi) {
    const nom = String(saisie || "").trim().toUpperCase();
    const m = window.FTSParc ? FTSParc.parNom(nom) || FTSParc.parNumero(nom) : null;
    if (m) return { nom: m.nom, ftsLoc: "FTS", numero: m.numero };
    return { nom, ftsLoc: String(ftsLocSaisi || "").trim().toUpperCase() || "LOC", numero: "" };
  }

  function ouvrirEdition(liste, titre, defaut) {
    const corps = `<div class="full" style="grid-column:1/-1">${liste.map((e, i) => estMateriel
      ? `<div class="pt-ent" data-i="${i}"><div class="q">${esc(e.cols[1])} <span class="sv-st ${esc(String(e.cols[2]).toUpperCase())}" style="margin-left:6px"><i></i>${esc(LIB_ST[String(e.cols[2]).toUpperCase()] || e.cols[2])}</span><small>${esc(e.fr)} · ${esc(e.chantierName)}${(e.cols[3] || "").toUpperCase() === "LOC" ? " · LOC" : ""}</small></div>
          <div style="white-space:nowrap"><button type="button" class="sv-ib" data-a="edit" title="Modifier">✏️</button><button type="button" class="sv-ib" data-a="del" title="Supprimer">🗑️</button></div>
          <div class="ed"><input type="text" class="e-m" list="dlMachines" value="${esc(e.cols[1])}" style="min-width:180px"><select class="e-s">${STATUTS.map((s) => `<option value="${s}" ${String(e.cols[2]).toUpperCase() === s ? "selected" : ""}>${LIB_ST[s]}</option>`).join("")}</select><button type="button" class="sv-btn pri" data-a="save">Enregistrer</button></div></div>`
      : `<div class="pt-ent" data-i="${i}"><div class="q">${esc(e.cols[1])}${e.cols[2] === "Intérim" ? ' <span class="sv-int">INTÉRIM</span>' : ""} · ${e.cols[4] ? esc(e.cols[4]) + " h" : "—"}${e.cols[3] === "GD" ? ' <span class="sv-gd">GD</span>' : ""}<small>${esc(e.fr)} · ${esc(e.chantierName)}</small></div>
          <div style="white-space:nowrap"><button type="button" class="sv-ib" data-a="edit" title="Modifier">✏️</button><button type="button" class="sv-ib" data-a="del" title="Supprimer">🗑️</button></div>
          <div class="ed"><input type="text" class="e-n" list="dlNoms" value="${esc(e.cols[1])}" style="min-width:160px"><select class="e-t"><option value="FTS" ${e.cols[2] !== "Intérim" ? "selected" : ""}>FTS</option><option value="Intérim" ${e.cols[2] === "Intérim" ? "selected" : ""}>Intérim</option></select><input type="text" class="e-h" value="${esc(e.cols[4] || "")}" placeholder="heures" style="width:80px"><label style="display:flex;gap:4px;align-items:center;font-size:.86rem;font-weight:600"><input type="checkbox" class="e-g" ${e.cols[3] === "GD" ? "checked" : ""}> GD</label><button type="button" class="sv-btn pri" data-a="save">Enregistrer</button></div>
          <div class="pt-traj"><div class="bx"><div class="lb">🏠 Domicile → chantier</div><div class="v att" data-t="dom">Calcul…</div><div class="d" data-t="domd"></div></div><div class="bx"><div class="lb">📍 Zone FTS (depuis le dépôt)</div><div class="v att" data-t="zone">Calcul…</div><div class="d" data-t="zoned"></div></div></div></div>`).join("")}</div>
      <p class="sv-mstatus" id="edStatus"></p>`;
    const m = FTSShell.modale({ titre: esc(titre), corps, pied: `<button type="button" class="sv-btn" data-x>Fermer</button><button type="button" class="sv-btn" data-add>+ Ajouter une ligne</button>` });
    const st = m.el.querySelector("#edStatus");
    if (!estMateriel) remplirTrajets(m.el, liste);
    m.el.querySelector("[data-x]").addEventListener("click", m.fermer);
    m.el.querySelector("[data-add]").addEventListener("click", () => { m.fermer(); ouvrirAjout({ ...defaut, chantierId: liste[0].chantierId }); });
    m.el.querySelectorAll(".pt-ent").forEach((row) => {
      const e = liste[Number(row.dataset.i)];
      row.querySelector('[data-a="edit"]').addEventListener("click", () => row.classList.toggle("editing"));
      row.querySelector('[data-a="del"]').addEventListener("click", async (ev) => {
        if (!confirm("Supprimer cette ligne de pointage ?")) return;
        m.el.querySelectorAll("button").forEach((b) => (b.disabled = true));
        st.textContent = "Suppression…";
        try {
          await FTSSheets.supprimerLignePointage(e.spreadsheetId, onglet, e.sheetRow);
          m.fermer(); FTSShell.toast("Ligne supprimée."); charger(true);
        } catch (err) { st.textContent = `Erreur : ${err.message}`; st.className = "sv-mstatus err"; m.el.querySelectorAll("button").forEach((b) => (b.disabled = false)); }
      });
      row.querySelector('[data-a="save"]').addEventListener("click", async (ev) => {
        ev.target.disabled = true; st.textContent = "Enregistrement…"; st.className = "sv-mstatus";
        try {
          let valeurs;
          if (estMateriel) {
            const mp = machinePointage(row.querySelector(".e-m").value, e.cols[3]);
            valeurs = [e.fr, mp.nom, row.querySelector(".e-s").value, mp.ftsLoc, mp.numero, e.cols[5] || ""];
          } else {
            valeurs = [e.fr, row.querySelector(".e-n").value.trim().toUpperCase(), row.querySelector(".e-t").value, row.querySelector(".e-g").checked ? "GD" : "", row.querySelector(".e-h").value.trim().replace(".", ","), e.cols[5] || ""];
          }
          await FTSSheets.modifierLignePointage(e.spreadsheetId, onglet, e.sheetRow, valeurs);
          m.fermer(); FTSShell.toast("Modification enregistrée."); charger(true);
        } catch (err) { st.textContent = `Erreur : ${err.message}`; st.className = "sv-mstatus err"; ev.target.disabled = false; }
      });
    });
  }

  // Km domicile → chantier (route) et zone FTS (vol d'oiseau depuis le dépôt)
  function remplirTrajets(el, liste) {
    if (typeof FTSTrajets === "undefined") return;
    const kmTxt = (k) => fmt(k, k < 10 ? 1 : 0);
    const duree = (min) => { const h = Math.floor(min / 60), mn = Math.round(min % 60); return h ? `${h} h ${String(mn).padStart(2, "0")}` : `${mn} min`; };
    liste.forEach((e, i) => {
      const row = el.querySelector(`.pt-ent[data-i="${i}"]`);
      if (!row) return;
      const q = (k) => row.querySelector(`[data-t="${k}"]`);
      const c = (donnees.chantiers || []).find((x) => x.id === e.chantierId) || {};
      FTSTrajets.calculer({ nom: e.cols[1], chantierId: e.chantierId, chantierName: e.chantierName, meta: c.meta, interim: e.cols[2] === "Intérim" }).then((r) => {
        if (!row.isConnected) return;
        const approx = r.lieuChantier ? ` · chantier placé à ${r.lieuChantier}${r.chantierApprox ? " (commune, approx.)" : ""}` : "";
        if (r.interim) {
          q("dom").className = "v att"; q("dom").textContent = "Intérimaire";
          q("domd").textContent = "Pas de calcul pour le personnel intérimaire";
        } else if (r.domicile) {
          q("dom").className = "v";
          q("dom").innerHTML = `${kmTxt(r.domicile.km)} km <small>· ${duree(r.domicile.min)}</small>`;
          q("domd").textContent = `Par la route, aller simple${r.villeDomicile ? " · depuis " + r.villeDomicile : ""}${r.domicile.enregistre ? " · calculé le " + r.domicile.enregistre : ""}${approx}`;
        } else {
          q("dom").className = "v err"; q("dom").textContent = r.domErr;
          q("domd").textContent = r.domDetail || "";
        }
        if (r.zone) {
          const gd = e.cols[3] === "GD";
          q("zone").className = "v";
          q("zone").innerHTML = gd
            ? `<span class="pt-zone gd">GD</span> <small>zone ${esc(r.zone.nom)}</small>`
            : `<span class="pt-zone${r.zone.nom === "6" ? " z6" : ""}">Zone ${esc(r.zone.nom)}</span>`;
          q("zoned").textContent = r.zone.nom === "1A"
            ? "Au dépôt"
            : `${kmTxt(r.zone.km)} km à vol d'oiseau · zone ${r.zone.nom} = ${r.zone.lib}${gd ? " · grand déplacement : remplace la zone" : ""}${approx}`;
        } else {
          q("zone").className = "v err"; q("zone").textContent = r.zoneErr;
          q("zoned").textContent = "Renseigne l'adresse ou le GPS du chantier";
        }
      }).catch((err) => { if (row.isConnected) { q("dom").className = q("zone").className = "v err"; q("dom").textContent = q("zone").textContent = "Calcul impossible"; q("domd").textContent = err.message; } });
    });
  }

  // ─── Zones FTS : panneau replié à droite de Tous / Micropieux / Pieux ───
  const peutModifierZones = () => window.FTSAuth && FTSAuth.isSignedIn() && emailNorm(FTSAuth.emailMemorise()) === COMPTE_ZONES;
  function afficherZones() {
    const btn = $("zonesBtn"), pan = $("zonesPan");
    if (typeof FTSTrajets === "undefined" || estMateriel) return;
    btn.hidden = false;
    btn.classList.toggle("on", zonesOuvert);
    btn.setAttribute("aria-expanded", zonesOuvert ? "true" : "false");
    btn.querySelector(".chev").textContent = zonesOuvert ? "▴" : "▾";
    pan.hidden = !zonesOuvert;
    if (!zonesOuvert) return;
    const z = FTSTrajets.getZones(), modif = peutModifierZones();
    const pill = (n) => `<span class="pt-zone${n === "6" ? " z6" : ""}">${esc(n)}</span>`;
    const km = (n) => String(n).replace(".", ",");
    let bas = 0;
    const lignes = z.zones.map((x) => {
      const val = zonesEdition && zonesEdition[x.nom] != null ? zonesEdition[x.nom] : km(x.max);
      const l = `<tr><td>${pill(x.nom)}</td><td>${km(bas)} km</td><td>${modif ? `<input type="text" inputmode="decimal" data-z="${esc(x.nom)}" value="${esc(val)}"> km` : `${km(x.max)} km`}</td></tr>`;
      bas = x.max; return l;
    }).join("");
    pan.innerHTML = `<div class="zt">📍 Zones FTS</div>
      <div class="zs">Cercles à vol d'oiseau autour du dépôt · ${esc(FTSTrajets.DEPOT.label)}</div>
      <table><tr><th>Zone</th><th>De</th><th>Jusqu'à (inclus)</th></tr>
        <tr><td>${pill("1A")}</td><td colspan="2" class="mute">Au dépôt</td></tr>
        ${lignes}
        <tr><td>${pill("6")}</td><td>${km(bas)} km</td><td class="mute">au-delà · si retour à la maison, sinon GD</td></tr></table>
      <div class="zf">${modif
        ? `<span id="zInfo">${z.date ? `Modifié le ${esc(z.date)}${z.par ? " par " + esc(z.par) : ""}` : "Valeurs par défaut (jamais modifiées)"}</span><span><button type="button" class="sv-btn" id="zAnnul">Annuler</button> <button type="button" class="sv-btn pri" id="zSave">Enregistrer</button></span>`
        : `<span class="lock">🔒 Modifiable uniquement avec le compte conduc.fts</span><span>${z.date ? `Modifié le ${esc(z.date)}` : ""}</span>`}</div>`;
    if (!modif) return;
    pan.querySelectorAll("input[data-z]").forEach((inp) => inp.addEventListener("input", () => {
      zonesEdition = zonesEdition || {}; zonesEdition[inp.dataset.z] = inp.value;
      // « De » de la ligne suivante suit la limite saisie
      const rows = [...pan.querySelectorAll("tr")].slice(2);
      rows.forEach((tr, k) => { if (k === 0) return; const prev = rows[k - 1].querySelector("input[data-z]"); if (prev) tr.children[1].textContent = `${prev.value || "?"} km`; });
    }));
    $("zAnnul").addEventListener("click", () => { zonesEdition = null; afficherZones(); });
    $("zSave").addEventListener("click", async (ev) => {
      const liste = [...pan.querySelectorAll("input[data-z]")].map((inp) => ({ nom: inp.dataset.z, max: parseFloat(inp.value.replace(",", ".")) }));
      const err = FTSTrajets.verifierZones(liste);
      if (err) { $("zInfo").innerHTML = `<span class="zerr">${esc(err)}</span>`; return; }
      ev.target.disabled = true; $("zInfo").textContent = "Enregistrement…";
      try {
        await FTSTrajets.enregistrerZones(liste, FTSAuth.emailMemorise());
        zonesEdition = null; afficherZones(); FTSShell.toast("Zones enregistrées.");
      } catch (e) { ev.target.disabled = false; $("zInfo").innerHTML = `<span class="zerr">Erreur : ${esc(e.message)}</span>`; }
    });
  }
  $("zonesBtn").addEventListener("click", () => {
    zonesOuvert = !zonesOuvert;
    if (zonesOuvert && window.FTSAuth && FTSAuth.isSignedIn()) FTSTrajets.chargerZones().then(() => afficherZones());
    afficherZones();
  });

  function ouvrirAjout(pre) {
    if (!donnees) { FTSShell.toast("Connecte-toi d'abord."); return; }
    const chantiers = donnees.chantiers.filter((c) => dansFamille(famChantier(c.meta)) && (c.meta || {}).statutChantier !== "Termine");
    const dateISO = pre.date ? isoDate(parseFR(pre.date)) : isoDate(new Date());
    const m = FTSShell.modale({
      titre: estMateriel ? "Ajouter un pointage matériel" : "Ajouter un pointage personnel",
      corps: `<div class="sv-f full"><label>Chantier</label><select id="aCh">${chantiers.map((c) => `<option value="${esc(c.id)}" ${c.id === pre.chantierId ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select></div>
        <div class="sv-f"><label>Date</label><input type="date" id="aDate" value="${dateISO}"></div>
        ${estMateriel
          ? `<div class="sv-f"><label>Statut</label><select id="aSt">${STATUTS.map((s) => `<option value="${s}">${LIB_ST[s]}</option>`).join("")}</select></div>
             <div class="sv-f full"><label>Machine <i>(nom du Parc matériel ; pour une centrale, ajoute MA12, PH15 et GE)</i></label><input type="text" id="aM" list="dlMachines" value="${esc(pre.machine || "")}" placeholder="ex : FUTURO N°1"></div>`
          : `<div class="sv-f"><label>Nom</label><input type="text" id="aN" list="dlNoms" value="${esc(pre.nom || "")}" placeholder="ex : HUGO LAJUS"></div>
             <div class="sv-f"><label>Type</label><select id="aT"><option value="FTS">FTS</option><option value="Intérim">Intérim</option></select></div>
             <div class="sv-f"><label>Heures</label><input type="text" id="aH" placeholder="ex : 8"></div>
             <div class="sv-f"><label>&nbsp;</label><span class="chkline"><input type="checkbox" id="aG"> Grand déplacement</span></div>`}
        <p class="sv-mstatus" id="aStatus"></p>`,
      pied: `<button type="button" class="sv-btn" data-x>Annuler</button><button type="button" class="sv-btn pri" id="aOk">Ajouter</button>`,
    });
    m.el.querySelector("[data-x]").addEventListener("click", m.fermer);
    m.el.querySelector("#aOk").addEventListener("click", async (ev) => {
      const st = m.el.querySelector("#aStatus");
      const v = (id) => (m.el.querySelector("#" + id) || {}).value || "";
      const c = donnees.chantiers.find((x) => x.id === v("aCh"));
      const qui = estMateriel ? v("aM").trim() : v("aN").trim();
      if (!c || !v("aDate") || !qui) { st.textContent = "Chantier, date et " + (estMateriel ? "machine" : "nom") + " sont obligatoires."; st.className = "sv-mstatus err"; return; }
      const [a, mo, j] = v("aDate").split("-");
      const fr = `${j}/${mo}/${a}`;
      let valeurs;
      if (estMateriel) { const mp = machinePointage(qui, ""); valeurs = [fr, mp.nom, v("aSt"), mp.ftsLoc, mp.numero]; }
      else valeurs = [fr, qui.toUpperCase(), v("aT"), m.el.querySelector("#aG").checked ? "GD" : "", v("aH").trim().replace(".", ",")];
      ev.target.disabled = true; st.textContent = "Ajout…"; st.className = "sv-mstatus";
      try {
        await FTSSheets.ajouterLignePointage(c.id, c.name, onglet, valeurs);
        m.fermer(); FTSShell.toast("Entrée ajoutée."); charger(true);
      } catch (err) { st.textContent = `Erreur : ${err.message}`; st.className = "sv-mstatus err"; ev.target.disabled = false; }
    });
  }

  // ═══ Export / agenda ═══════════════════════════════════════════
  function entreesAffichees() {
    const toutes = entrees().filter((e) => dansFamille(e.fam));
    if (vue === "recap") { const [d1, d2] = bornesRecap(); const q = $("recherche").value.trim().toLowerCase(); return toutes.filter((e) => (!d1 || e.date >= d1) && (!d2 || e.date <= d2) && (!q || e.chantierName.toLowerCase().includes(q))); }
    const frs = new Set(joursPeriode().map(frDate));
    return toutes.filter((e) => frs.has(e.fr));
  }

  function telecharger(lignes, nom) {
    const csv = lignes.map((l) => l.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" }));
    const a = document.createElement("a"); a.href = url; a.download = nom; a.click(); URL.revokeObjectURL(url);
  }

  function exporter() {
    if (!donnees) return;
    const es = entreesAffichees().sort((a, b) => a.date - b.date || a.chantierName.localeCompare(b.chantierName));
    const suffixe = `${famille === "tous" ? "" : famille === "mp" ? "_micropieux" : "_pieux"}`;
    if (estMateriel && vue === "recap") {
      const lignes = [["Chantier", "Machine", "Travail (j)", "Panne (j)", "Arrêt (j)", "Transport (j)", "Total (j)"]];
      const parCh = {};
      es.forEach((e) => { const g = FTSAteliers.groupeDePointage(e.cols[1], e.cols[4], e.cols[3], e.chef); const k = e.chantierName + "||" + g.libelle; (parCh[k] = parCh[k] || { ch: e.chantierName, m: g.libelle + (g.section === "loc" ? " (LOC)" : ""), j: {} }); (parCh[k].j[e.fr] = parCh[k].j[e.fr] || []).push(e.cols[2]); });
      Object.values(parCh).sort((a, b) => a.ch.localeCompare(b.ch) || a.m.localeCompare(b.m)).forEach((g) => {
        const n = { TRAVAIL: 0, PANNE: 0, ARRET: 0, TRANSPORT: 0 };
        Object.values(g.j).forEach((s) => { const st = FTSAteliers.statutDuJour(s); if (n[st] !== undefined) n[st]++; });
        lignes.push([g.ch, g.m, n.TRAVAIL, n.PANNE, n.ARRET, n.TRANSPORT, n.TRAVAIL + n.PANNE + n.ARRET + n.TRANSPORT]);
      });
      return telecharger(lignes, `Recap_materiel_par_chantier${suffixe}.csv`);
    }
    const lignes = estMateriel ? [["Date", "Chantier", "Machine", "Statut", "FTS/LOC", "N° machine"]] : [["Date", "Chantier", "Nom", "Type", "GD", "Heures"]];
    es.forEach((e) => lignes.push([e.fr, e.chantierName, ...e.cols.slice(1, estMateriel ? 5 : 5)]));
    telecharger(lignes, `Pointage_${estMateriel ? "materiel" : "personnel"}_S${numSemaine(debut)}_${debut.getFullYear()}${suffixe}.csv`);
  }

  async function synchroniser() {
    if (!window.FTSAuth || !FTSAuth.isSignedIn()) { FTSShell.toast("Connecte-toi d'abord."); return; }
    if (!window.FTSCalendar) { FTSShell.toast("Module Agenda non chargé."); return; }
    const es = entreesAffichees();
    if (!es.length) { FTSShell.toast("Rien à synchroniser sur cette période."); return; }
    const b = $("syncBtn"); b.disabled = true;
    FTSShell.toast("Synchronisation avec Google Agenda…", 20000);
    try {
      const groupes = {};
      es.forEach((e) => { const k = e.chantierName + "||" + isoDate(e.date); (groupes[k] = groupes[k] || { ch: e.chantierName, iso: isoDate(e.date), items: [] }).items.push(e.cols); });
      for (const g of Object.values(groupes)) {
        if (estMateriel) await FTSCalendar.enregistrerPointageMachine(g.ch, g.iso, g.items.map((c) => ({ nom: c[1], statut: c[2], ftsLoc: c[3], atelier: c[5] || "" })));
        else await FTSCalendar.enregistrerPointagePersonnel(g.ch, g.iso, g.items.map((c) => ({ nom: c[1], type: c[2], gd: c[3] === "GD", heures: c[4], atelier: c[5] || "" })));
      }
      FTSShell.toast(`Agenda mis à jour (${Object.keys(groupes).length} jour(s) × chantier).`);
    } catch (err) { FTSShell.toast(`Erreur de synchronisation : ${err.message}`, 6000); }
    finally { b.disabled = false; }
  }

  FTSShell.monter({
    actif: estMateriel ? "materiel" : "personnel",
    titre: estMateriel ? "Pointage matériel" : "Pointage personnel",
    sousTitre: estMateriel ? "Où est chaque machine, jour par jour" : "Heures et grands déplacements, jour par jour",
    actions: `<button type="button" class="sv-btn" id="syncBtn">📅 Synchroniser l'agenda</button>
      <button type="button" class="sv-btn" id="exportBtn">⬇️ Exporter Excel</button>
      <button type="button" class="sv-btn pri" id="ajoutBtn">+ Ajouter une entrée</button>`,
    menuMobile: [
      { label: "+ Ajouter une entrée", action: () => ouvrirAjout({}) },
      { label: "⬇️ Exporter Excel", action: () => exporter() },
      { label: "📅 Synchroniser l'agenda", action: () => synchroniser() },
      { label: "🔄 Actualiser", action: () => charger(true) },
    ],
    onSession: (c) => { if (c) charger(); else afficher(); },
  });

  // ═══ Commandes ═════════════════════════════════════════════════
  $("ajoutBtn").addEventListener("click", () => ouvrirAjout({}));
  $("exportBtn").addEventListener("click", exporter);
  $("syncBtn").addEventListener("click", synchroniser);
  document.querySelectorAll("#vueSeg button").forEach((b) => b.addEventListener("click", () => { vue = b.dataset.v; setPref("vue", vue); afficher(); }));
  document.querySelectorAll("#famSeg button").forEach((b) => b.addEventListener("click", () => { famille = b.dataset.f; setPref("fam", famille); afficher(); }));
  document.querySelectorAll("#dureeSeg button").forEach((b) => b.addEventListener("click", () => {
    nbSemaines = Number(b.dataset.n); setPref("sem", String(nbSemaines));
    debut = nbSemaines === 1 ? lundi(new Date()) : ajoute(lundi(new Date()), -7 * (nbSemaines === 4 ? 2 : 1));
    afficher();
  }));
  $("precBtn").addEventListener("click", () => { debut = ajoute(debut, -7 * (estMateriel ? nbSemaines : 1)); afficher(); });
  $("suivBtn").addEventListener("click", () => { debut = ajoute(debut, 7 * (estMateriel ? nbSemaines : 1)); afficher(); });
  $("auj").addEventListener("click", () => { debut = nbSemaines <= 1 ? lundi(new Date()) : ajoute(lundi(new Date()), -7 * (nbSemaines === 4 ? 2 : 1)); afficher(); });
  $("recherche").addEventListener("input", afficher);
  $("periodeSel").addEventListener("change", () => { $("persoDates").style.display = $("periodeSel").value === "perso" ? "flex" : "none"; afficher(); });
  ["du", "au"].forEach((id) => $(id).addEventListener("change", afficher));
  $("auj").textContent = estMateriel ? "Aujourd'hui" : "Semaine actuelle";

  // Téléphone : version allégée — le pointage reste consultable sur demande
  let forcer = false;
  try { forcer = sessionStorage.getItem("fts_pt_forcer") === "1"; } catch (e) {}
  if (FTSShell.estTelephone() && !forcer) { document.body.classList.add("pt-bloque"); $("ptTel").hidden = false; }
  $("ptForcer").addEventListener("click", () => {
    try { sessionStorage.setItem("fts_pt_forcer", "1"); } catch (e) {}
    document.body.classList.remove("pt-bloque"); $("ptTel").hidden = true;
  });

  remplirListes();
  afficher();
});
</script>
</body>
</html>
